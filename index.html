function generateFullActivityPDF(){
  var empName=document.getElementById('far-emp').value;
  var pdfLang=document.getElementById('far-lang').value;
  var btn=document.getElementById('far-btn');
  var statusEl=document.getElementById('far-status');
  var FR=pdfLang==='fr';
  btn.disabled=true; btn.textContent=FR?'Chargement...':'Loading...';
  statusEl.textContent=FR?'Récupération des données...':'Fetching data...';

  function safe(s){ return s?String(s).replace(/[^\x00-\x7E\u00C0-\u024F]/g,'?').trim()||'—':'—'; }
  function fmtDate(ts){ try{return ts?ts.toDate().toLocaleDateString(FR?'fr-CA':'en-CA'):'—';}catch(e){return '—';} }
  function fmtTime(ts){ try{return ts?ts.toDate().toLocaleTimeString('en-CA',{hour12:false,hour:'2-digit',minute:'2-digit'}):'—';}catch(e){return '—';} }

  var PURPLE=[100,40,200];
  var LIGHT=[240,237,255];
  var WHITE=[255,255,255];
  var DARK=[40,40,40];
  var GRAY=[120,120,120];

  Promise.all([
    db.collection('leads').where('submittedBy','==',empName).get(),
    db.collection('tablets').where('submittedBy','==',empName).get(),
    db.collection('restaurants').where('submittedBy','==',empName).get(),
    db.collection('clock').where('userName','==',empName).get()
  ]).then(function(results){

    var myLeads=[]; results[0].forEach(function(d){var x=d.data();myLeads.push(x);});
    myLeads.sort(function(a,b){return (a.createdAt?a.createdAt.toDate():new Date(0))-(b.createdAt?b.createdAt.toDate():new Date(0));});

    var myTablets=[]; results[1].forEach(function(d){var x=d.data();myTablets.push(x);});
    myTablets.sort(function(a,b){return (a.createdAt?a.createdAt.toDate():new Date(0))-(b.createdAt?b.createdAt.toDate():new Date(0));});

    var myRests=[]; results[2].forEach(function(d){var x=d.data();myRests.push(x);});
    myRests.sort(function(a,b){return (a.createdAt?a.createdAt.toDate():new Date(0))-(b.createdAt?b.createdAt.toDate():new Date(0));});

    // Merge clock by date
    var clockByDate={};
    results[3].forEach(function(d){
      var data=d.data(), date=data.date||'';
      if(!clockByDate[date])clockByDate[date]={date:date,ins:[],outs:[],ms:0,tasks:[]};
      var e=clockByDate[date];
      if(data.clockIn)e.ins.push(data.clockIn);
      if(data.clockOut)e.outs.push(data.clockOut);
      if(data.clockIn&&data.clockOut)e.ms+=data.clockOut.toDate()-data.clockIn.toDate();
      if(data.endOfDayTasks&&e.tasks.indexOf(data.endOfDayTasks)<0)e.tasks.push(data.endOfDayTasks);
    });
    var clockData=Object.values(clockByDate).sort(function(a,b){return a.date.localeCompare(b.date);});
    var totalMs=0; clockData.forEach(function(d){totalMs+=d.ms;});
    var totalH=Math.floor(totalMs/3600000),totalM=Math.floor((totalMs%3600000)/60000);
    var daysWorked=clockData.filter(function(d){return d.outs.length>0;}).length;
    var daysMissed=clockData.filter(function(d){return d.ins.length>0&&d.outs.length===0;}).length;

    var doc=new window.jspdf.jsPDF({unit:'pt',format:'a4'});
    var today=new Date().toLocaleDateString(FR?'fr-CA':'en-CA');
    var pageW=doc.internal.pageSize.getWidth();
    var pageH=doc.internal.pageSize.getHeight();

    function addHeader(){
      doc.setFillColor(PURPLE[0],PURPLE[1],PURPLE[2]);
      doc.rect(0,0,pageW,76,'F');
      doc.setTextColor(255,255,255);
      doc.setFontSize(20);doc.setFont(undefined,'bold');
      doc.text('BranChef HQ',40,36);
      doc.setFontSize(12);doc.setFont(undefined,'normal');
      doc.text((FR?'Rapport complet — ':'Full Activity Report — ')+empName,40,56);
      doc.setFontSize(8);doc.setTextColor(200,185,255);
      doc.text((FR?'Généré le ':'Generated on ')+today,40,70);
    }
    addHeader();

    var Y=96;

    // Summary
    doc.setFillColor(LIGHT[0],LIGHT[1],LIGHT[2]);
    doc.roundedRect(40,Y,pageW-80,64,6,6,'F');
    doc.setTextColor(PURPLE[0],PURPLE[1],PURPLE[2]);
    doc.setFontSize(8.5);doc.setFont(undefined,'bold');
    var col1=52,col2=210,col3=370,col4=490;
    doc.text((FR?'Contrats soumis':'Contracts submitted'),col1,Y+18);
    doc.text((FR?'Tablettes demandées':'Tablets requested'),col2,Y+18);
    doc.text((FR?'Restaurants':'Restaurants'),col3,Y+18);
    doc.text((FR?'Total heures':'Total hours'),col4,Y+18);
    doc.setFontSize(16);doc.setFont(undefined,'bold');
    doc.text(String(myLeads.length),col1+10,Y+46);
    doc.text(String(myTablets.length),col2+18,Y+46);
    doc.text(String(myRests.length),col3+18,Y+46);
    doc.text(totalH+'h '+totalM+'m',col4,Y+46);
    Y+=80;

    function sectionTitle(txt){
      if(Y>680){doc.addPage();addHeader();Y=96;}
      doc.setFillColor(PURPLE[0],PURPLE[1],PURPLE[2]);
      doc.rect(40,Y,pageW-80,24,'F');
      doc.setTextColor(255,255,255);
      doc.setFontSize(10);doc.setFont(undefined,'bold');
      doc.text(txt,48,Y+16);
      doc.setFont(undefined,'normal');
      Y+=30;
    }

    var tblStyles={
      styles:{fontSize:8,cellPadding:5,textColor:DARK,lineColor:[210,205,230],lineWidth:0.3},
      headStyles:{fillColor:PURPLE,textColor:WHITE,fontStyle:'bold',fontSize:8.5},
      alternateRowStyles:{fillColor:LIGHT},
      tableLineColor:PURPLE,tableLineWidth:0.3
    };

    // ── 1. CONTRACTS ──
    sectionTitle(FR?'1. Contrats soumis ('+myLeads.length+')':'1. Contracts submitted ('+myLeads.length+')');
    if(myLeads.length){
      doc.autoTable(Object.assign({},tblStyles,{
        startY:Y,
        head:[[FR?'Date soumis':'Date submitted',FR?'Restaurant':'Restaurant',FR?'Propriétaire':'Owner','Email',FR?'Téléphone':'Phone']],
        body:myLeads.map(function(l){
          return [fmtDate(l.createdAt),safe(l.restaurantName),safe(l.ownerName),safe(l.ownerEmail),safe(l.phone)];
        }),
        columnStyles:{0:{cellWidth:75},3:{cellWidth:130}}
      }));
      Y=doc.lastAutoTable.finalY+18;
    }else{
      doc.setFontSize(9);doc.setTextColor(GRAY[0],GRAY[1],GRAY[2]);
      doc.text(FR?'Aucun contrat soumis.':'No contracts submitted.',52,Y);Y+=18;
    }

    // ── 2. TABLETS ──
    if(Y>680){doc.addPage();addHeader();Y=96;}
    sectionTitle(FR?'2. Tablettes demandées ('+myTablets.length+')':'2. Tablets requested ('+myTablets.length+')');
    if(myTablets.length){
      doc.autoTable(Object.assign({},tblStyles,{
        startY:Y,
        head:[[FR?'Date demande':'Date requested',FR?'Restaurant':'Restaurant',FR?'Propriétaire':'Owner',FR?'Téléphone':'Phone',FR?'Adresse':'Address',FR?'Date expédition':'Shipped date']],
        body:myTablets.map(function(tb){
          return [fmtDate(tb.createdAt),safe(tb.restaurantName),safe(tb.ownerName),safe(tb.phone),safe(tb.address),tb.status==='shipped'?fmtDate(tb.shippedAt):(FR?'Pas encore':'Not yet')];
        }),
        columnStyles:{0:{cellWidth:75},5:{cellWidth:75}}
      }));
      Y=doc.lastAutoTable.finalY+18;
    }else{
      doc.setFontSize(9);doc.setTextColor(GRAY[0],GRAY[1],GRAY[2]);
      doc.text(FR?'Aucune tablette demandée.':'No tablets requested.',52,Y);Y+=18;
    }

    // ── 3. RESTAURANTS ──
    if(Y>680){doc.addPage();addHeader();Y=96;}
    sectionTitle(FR?'3. Restaurants apportés ('+myRests.length+')':'3. Restaurants brought ('+myRests.length+')');
    if(myRests.length){
      doc.autoTable(Object.assign({},tblStyles,{
        startY:Y,
        head:[[FR?'Date':'Date',FR?'Restaurant':'Restaurant',FR?'Propriétaire':'Owner',FR?'Adresse':'Address',FR?'Marques':'Brands',FR?'Étape actuelle':'Current step']],
        body:myRests.map(function(r){
          var step=r.status==='live'?(FR?'En ligne':'Live'):(STEP_LABELS[r.stepIndex||0]||'Step '+(r.stepIndex||0));
          return [fmtDate(r.createdAt),safe(r.name),safe(r.ownerName),safe(r.address),(r.brands||[]).join(', ')||'—',step];
        }),
        columnStyles:{0:{cellWidth:75}}
      }));
      Y=doc.lastAutoTable.finalY+18;
    }else{
      doc.setFontSize(9);doc.setTextColor(GRAY[0],GRAY[1],GRAY[2]);
      doc.text(FR?'Aucun restaurant.':'No restaurants.',52,Y);Y+=18;
    }

    // ── 4. CLOCK HISTORY ──
    if(Y>680){doc.addPage();addHeader();Y=96;}
    sectionTitle(FR?'4. Historique de pointage ('+daysWorked+' jours complets, '+daysMissed+' sorties manquantes)':'4. Clock history ('+daysWorked+' full days, '+daysMissed+' missing clock-outs)');
    if(clockData.length){
      doc.autoTable(Object.assign({},tblStyles,{
        startY:Y,
        head:[[FR?'Date':'Date',FR?'Entrée':'Clock In',FR?'Sortie':'Clock Out',FR?'Durée':'Duration',FR?'Note':'Note']],
        body:clockData.map(function(d){
          var inT=d.ins.length?fmtTime(d.ins[0]):'—';
          var outT=d.outs.length?fmtTime(d.outs[d.outs.length-1]):(FR?'Manquant':'Missing');
          var h=Math.floor(d.ms/3600000),m=Math.floor((d.ms%3600000)/60000);
          var dur=d.ms>0?(h>0?h+'h '+m+'m':m+'m'):'—';
          var note=d.tasks.length?d.tasks[0].substring(0,60)+(d.tasks[0].length>60?'...':''):'';
          return [d.date,inT,outT,dur,note];
        }),
        columnStyles:{0:{cellWidth:80},1:{cellWidth:58},2:{cellWidth:68},3:{cellWidth:55}}
      }));
    }

    // Footer
    var pageCount=doc.internal.getNumberOfPages();
    for(var p=1;p<=pageCount;p++){
      doc.setPage(p);
      doc.setFillColor(PURPLE[0],PURPLE[1],PURPLE[2]);
      doc.rect(0,pageH-22,pageW,22,'F');
      doc.setFontSize(7.5);doc.setTextColor(255,255,255);
      doc.text('BranChef HQ  —  '+empName,40,pageH-8);
      doc.text(p+' / '+pageCount,pageW-50,pageH-8);
    }

    var fname='BranChef_'+empName.replace(/ /g,'_')+'_'+today+'.pdf';
    doc.save(fname);
    showToast('PDF downloaded!');
    btn.disabled=false;btn.textContent='📊 Generate Full Report';
    statusEl.textContent=(FR?'Téléchargé: ':'Downloaded: ')+fname;

  }).catch(function(e){
    showToast('Error: '+e.message);
    btn.disabled=false;btn.textContent='📊 Generate Full Report';
    statusEl.textContent='Error: '+e.message;
  });
}

function generateMonthlyPDF(){
  var emp=document.getElementById('mr-emp').value;
  var monthInput=document.getElementById('mr-month').value;
  var pdfLang=document.getElementById('mr-lang').value;
  var includeNotes=document.getElementById('mr-notes').checked;
  if(!monthInput){showToast('Pick a month');return;}
  var btn=document.getElementById('mr-btn');
  btn.disabled=true;btn.textContent='Loading...';

  var year=parseInt(monthInput.split('-')[0]);
  var monthNum=parseInt(monthInput.split('-')[1]);
  var firstDay=monthInput+'-01';
  var daysInMonth=new Date(year,monthNum,0).getDate();
  var lastDay=monthInput+'-'+String(daysInMonth).padStart(2,'0');

  var FR=pdfLang==='fr';
  var L={
    title: FR?'BranChef — Rapport de présence':'BranChef — Attendance Report',
    days: FR?['Dim','Lun','Mar','Mer','Jeu','Ven','Sam']:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],
    headers: FR?['Jour','Entrée','Sortie','Durée','Statut']:['Day','Clock In','Clock Out','Duration','Status'],
    absent: FR?'Absent':'Absent',
    complete: FR?'Complet':'Complete',
    noClockOut: FR?'Pas de sortie':'No clock-out',
    summary: function(w,a,m,h,mi){
      return FR
        ?'Jours travaillés: '+w+'   |   Jours absents: '+a+'   |   Sorties manquées: '+m+'   |   Total: '+h+'h '+mi+'m'
        :'Days worked: '+w+'   |   Days absent: '+a+'   |   Missed clock-outs: '+m+'   |   Total: '+h+'h '+mi+'m';
    }
  };

  db.collection('clock').where('date','>=',firstDay).where('date','<=',lastDay).get().then(function(snap){
    var allEntries=[];
    snap.forEach(function(d){allEntries.push(d.data());});

    var names=emp==='__all__'?Object.values(TEAM).map(function(t){return t.name;}):[emp];
    var doc=new window.jspdf.jsPDF({unit:'pt',format:'a4'});
    var monthName=new Date(year,monthNum-1,1).toLocaleDateString(FR?'fr-CA':'en-US',{month:'long',year:'numeric'});

    names.forEach(function(empName,idx){
      if(idx>0)doc.addPage();

      doc.setFontSize(18);doc.setTextColor(124,58,237);
      doc.text(L.title,40,46);
      doc.setFontSize(13);doc.setTextColor(40,40,40);
      doc.text(empName,40,68);
      doc.setFontSize(10);doc.setTextColor(120,120,120);
      doc.text(monthName,40,84);

      var empEntries=allEntries.filter(function(e){return e.userName===empName;});
      var totalMs=0,worked=0,missed=0,absent=0;
      var body=[],notes=[];

      for(var day=1;day<=daysInMonth;day++){
        var dateStr=monthInput+'-'+String(day).padStart(2,'0');
        var dObj=new Date(year,monthNum-1,day);
        var dayLabel=L.days[dObj.getDay()]+' '+day;
        var dayEntries=empEntries.filter(function(e){return e.date===dateStr;});

        if(!dayEntries.length){
          body.push([dayLabel,'—','—','—',L.absent]);
          absent++;continue;
        }
        worked++;
        var dayMs=0,inTimes=[],outTimes=[],missedOut=false,tasks=[],feelings=[];
        dayEntries.forEach(function(e){
          if(e.clockIn)inTimes.push(e.clockIn.toDate());
          if(e.clockOut){outTimes.push(e.clockOut.toDate());}
          else if(e.clockIn){missedOut=true;}
          if(e.clockIn&&e.clockOut)dayMs+=e.clockOut.toDate()-e.clockIn.toDate();
          if(e.endOfDayTasks)tasks.push(e.endOfDayTasks);
          if(e.endOfDayFeeling)feelings.push(e.endOfDayFeeling);
        });
        totalMs+=dayMs;if(missedOut)missed++;
        var fmt=function(t){return t.toLocaleTimeString('en-CA',{hour12:false,hour:'2-digit',minute:'2-digit'});};
        var inS=inTimes.length?inTimes.map(fmt).join(', '):'—';
        var outS=outTimes.length?outTimes.map(fmt).join(', '):(missedOut?'⚠ —':'—');
        var h=Math.floor(dayMs/3600000),m=Math.floor((dayMs%3600000)/60000);
        var dur=dayMs>0?(h>0?h+'h '+m+'m':m+'m'):'—';
        var status=missedOut?L.noClockOut:L.complete;
        body.push([dayLabel,inS,outS,dur,status]);
        if(includeNotes&&(tasks.length||feelings.length))
          notes.push([dayLabel,tasks.join(' / ')||'—',feelings.join(' / ')||'—']);
      }

      var th=Math.floor(totalMs/3600000),tm=Math.floor((totalMs%3600000)/60000);
      doc.setFontSize(8.5);doc.setTextColor(90,90,90);
      doc.text(L.summary(worked,absent,missed,th,tm),40,100);

      doc.autoTable({
        startY:114,head:[L.headers],body:body,
        styles:{fontSize:8,cellPadding:4},
        headStyles:{fillColor:[124,58,237],textColor:255,fontStyle:'bold'},
        alternateRowStyles:{fillColor:[248,247,255]},
        columnStyles:{0:{cellWidth:70},4:{cellWidth:90}},
        didParseCell:function(d){
          if(d.section==='body'){
            if(d.row.raw[4]===L.absent)d.cell.styles.textColor=[180,30,30];
            else if(d.row.raw[4]===L.noClockOut)d.cell.styles.textColor=[200,120,0];
            else if(d.row.raw[4]===L.complete)d.cell.styles.textColor=[20,140,80];
          }
        }
      });

      if(includeNotes&&notes.length){
        var y=doc.lastAutoTable.finalY+20;
        if(y>700){doc.addPage();y=46;}
        doc.setFontSize(11);doc.setTextColor(124,58,237);
        doc.text(FR?'Notes de fin de journée':'End-of-day notes',40,y);
        doc.autoTable({
          startY:y+10,
          head:[[FR?'Jour':'Day',FR?'Tâches':'Tasks',FR?'Journée':'Day']],
          body:notes,
          styles:{fontSize:7.5,cellPadding:4},
          headStyles:{fillColor:[40,40,60],textColor:255},
          columnStyles:{0:{cellWidth:60},1:{cellWidth:220},2:{cellWidth:180}}
        });
      }
    });

    var fname='BranChef_Attendance_'+(emp==='__all__'?'AllStaff':emp)+'_'+monthInput+'.pdf';
    doc.save(fname);
    showToast('PDF downloaded!');
    btn.disabled=false;btn.textContent='📄 Download PDF';
    document.getElementById('mr-status').textContent='Downloaded: '+fname;
  }).catch(function(e){
    showToast('Error: '+e.message);
    btn.disabled=false;btn.textContent='📄 Download PDF';
  });
}

var captchaCode='';
var captchaChars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

function genCaptcha(){
  captchaCode='';
  for(var i=0;i<5;i++) captchaCode+=captchaChars[Math.floor(Math.random()*captchaChars.length)];
  var ans=document.getElementById('captcha-ans');
  if(ans)ans.value='';
  drawCaptcha();
}

function drawCaptcha(){
  var canvas=document.getElementById('captcha-canvas');
  if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var w=canvas.width,h=canvas.height;

  // Background gradient
  var bg=ctx.createLinearGradient(0,0,w,h);
  bg.addColorStop(0,'#f0ebff');
  bg.addColorStop(1,'#e8f0ff');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,w,h);

  // Noise lines
  for(var i=0;i<6;i++){
    ctx.beginPath();
    ctx.moveTo(Math.random()*w,Math.random()*h);
    ctx.lineTo(Math.random()*w,Math.random()*h);
    ctx.strokeStyle='rgba('+(100+Math.floor(Math.random()*100))+','+(100+Math.floor(Math.random()*100))+','+(180+Math.floor(Math.random()*60))+',0.35)';
    ctx.lineWidth=1+Math.random();
    ctx.stroke();
  }

  // Noise dots
  for(var i=0;i<30;i++){
    ctx.beginPath();
    ctx.arc(Math.random()*w,Math.random()*h,Math.random()*2,0,Math.PI*2);
    ctx.fillStyle='rgba(100,80,200,0.2)';
    ctx.fill();
  }

  // Draw each character with random transforms
  var colors=['#6B21FF','#9B22CC','#3B44CC','#2277AA','#7B3FEF'];
  var fonts=['bold 26px Arial','bold 24px Georgia','bold 28px Verdana','bold 25px Courier New'];
  ctx.save();
  for(var i=0;i<captchaCode.length;i++){
    ctx.save();
    var x=16+i*28;
    var y=34+Math.random()*6-3;
    ctx.translate(x,y);
    ctx.rotate((Math.random()-0.5)*0.4);
    ctx.font=fonts[Math.floor(Math.random()*fonts.length)];
    ctx.fillStyle=colors[Math.floor(Math.random()*colors.length)];
    ctx.globalAlpha=0.85+Math.random()*0.15;
    // Shadow for depth
    ctx.shadowColor='rgba(100,50,200,0.3)';
    ctx.shadowBlur=2;
    ctx.fillText(captchaCode[i],0,0);
    ctx.restore();
  }
  ctx.restore();

  // Wavy overlay lines for distortion
  for(var i=0;i<2;i++){
    ctx.beginPath();
    ctx.moveTo(0,h/2+(i-0.5)*12);
    for(var x=0;x<w;x+=4){
      ctx.lineTo(x,h/2+(i-0.5)*12+Math.sin(x/8+i)*4);
    }
    ctx.strokeStyle='rgba(120,80,220,0.15)';
    ctx.lineWidth=1;
    ctx.stroke();
  }
}

// ==========================================
// DOCUSIGN SYNC
// DocuSign never calls us, so we ask it instead - every 60 seconds,
// from whoever has the app open. Works on any DocuSign plan.
// ==========================================
var DS_MAP={delivered:'viewed',completed:'pending_approval',declined:'rejected',voided:'rejected'};
var DS_OPEN=['sending','send_failed','pending','viewed'];   // only these may be overwritten

function syncEnvelopes(){
  if(!CU||!db||!leads.length)return;
  fetch('/api/check-envelopes')
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d||!d.ok)return;
      var live={};
      d.envelopes.forEach(function(e){live[e.envelopeId]=e;});

      // Some leads never got their envelopeId saved - the page can reload
      // between DocuSign accepting the envelope and Firestore being written.
      // Match those back up by the name in the agreement subject.
      var claimed={};
      leads.forEach(function(l){ if(l.envelopeId) claimed[l.envelopeId]=1; });
      leads.forEach(function(l){
        if(l.envelopeId)return;
        var nm=(l.restaurantName||'').trim().toLowerCase();
        if(!nm)return;
        for(var k in live){
          if(claimed[k])continue;
          if((live[k].subject||'').toLowerCase().indexOf(nm)>=0){
            l.envelopeId=k; claimed[k]=1;
            db.collection('leads').doc(l.id).update({envelopeId:k}).catch(function(){});
            break;
          }
        }
      });

      leads.forEach(function(l){
        if(!l.envelopeId)return;
        var e=live[l.envelopeId];
        if(!e)return;
        var next=DS_MAP[e.status];
        if(!next||next===l.status)return;
        if(DS_OPEN.indexOf(l.status)<0)return;   // already approved / shipped / live
        var upd={status:next,docusignStatus:e.status};
        if(e.completedAt)upd.signedAt=e.completedAt;
        if(next==='rejected')upd.rejectReason='Declined in DocuSign';
        db.collection('leads').doc(l.id).update(upd)
          .then(function(){notifyLead(l,next);})
          .catch(function(){});
      });
    })
    .catch(function(){});
}

function notifyLead(l,next){
  var who=l.restaurantName||'A restaurant';
  var msg,to,type;
  if(next==='viewed'){
    msg='\uD83D\uDC40 '+who+' opened the agreement';
    to=[l.submittedBy]; type='new';
  }else if(next==='pending_approval'){
    msg='\u270D\uFE0F '+who+' signed the agreement - tablet and setup can start';
    to=[l.submittedBy,'Nadir','Saber','Simo']; type='new';
  }else{
    msg='\u274C '+who+' declined the agreement';
    to=[l.submittedBy,'Nadir','Simo']; type='system';
  }
  if(next==='pending_approval'&&typeof sendEmail==='function'){
    sendEmail('SIGNED: '+who, l.submittedBy||'BranChef',
      who+' signed the agreement. Owner: '+(l.ownerName||'')
      +' | '+(l.ownerEmail||'')+' | '+(l.phone||'')
      +' | Address: '+(l.address||'')
      +' | Brands: '+((l.brands||[]).join(', ')||'-')
      +' | Ship the tablet and start the setup.');
  }
  var ref=db.collection('notifications').doc(l.id+'_'+next);
  ref.get().then(function(s){
    if(s.exists)return;   // another browser already wrote it
    ref.set({
      type:type, message:msg, to:to.filter(Boolean),
      read:false, createdBy:l.submittedBy,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
  }).catch(function(){});
}

function startSync(){
  setTimeout(syncEnvelopes,3000);          // let leads load first
  setInterval(syncEnvelopes,60000);
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden)syncEnvelopes();
  });
}

(function(){
  var CURRENT = '2026090404';
  function checkVersion(){
    fetch(window.location.href + '?v=' + Date.now(), {cache:'no-store'})
      .then(function(r){return r.text();})
      .then(function(html){
        var m = html.match(/<meta name="bc-version" content="([^"]+)"/);

          console.log('New version detected, reloading...');
          window.location.reload(true);
        }
      }).catch(function(){});
  }
  // Check every 60 seconds
  setInterval(checkVersion, 60000);
  // Also check when tab becomes visible again
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') checkVersion();
  });
})();
