<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --brand:#9B59FF;--brand2:#FF6FD8;--brand-dark:#7B3FEF;
  --brand-light:#F3EEFF;--brand-text:#5B1FBF;
  --sidebar:230px;
  --gray-50:#F9F9F7;--gray-100:#F0EEE8;--gray-200:#E0DDD4;
  --gray-400:#888780;--gray-600:#5F5E5A;--gray-800:#1E1E1C;
  --white:#fff;--red:#E24B4A;--red-light:#FCEBEB;
  --green:#22C55E;--green-light:#DCFCE7;
  --amber:#F59E0B;--amber-light:#FEF3C7;
  --radius:10px;--shadow:0 1px 4px rgba(0,0,0,.08);--shadow-lg:0 8px 24px rgba(0,0,0,.12);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--gray-50);color:var(--gray-800);font-size:14px;-webkit-font-smoothing:antialiased;}

/* LOADING */
#loading{position:fixed;inset:0;background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:16px;}
.spin{width:36px;height:36px;border:3px solid var(--brand-light);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* LOGIN */
#login-screen{min-height:100vh;display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,#6B21FF 0%,#9B59FF 55%,#FF6FD8 100%);padding:1rem;}
.login-box{background:var(--white);border-radius:20px;padding:2.5rem 2rem;width:100%;max-width:400px;box-shadow:var(--shadow-lg);}
.login-logo{text-align:center;margin-bottom:2rem;}
.login-logo img{width:72px;height:72px;border-radius:16px;margin-bottom:12px;}
.login-logo h1{font-size:24px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,var(--brand),var(--brand2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.login-logo p{font-size:13px;color:var(--gray-400);margin-top:4px;}

/* FORM */
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;font-weight:700;color:var(--gray-600);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--gray-200);border-radius:var(--radius);font-size:14px;color:var(--gray-800);background:var(--white);font-family:inherit;transition:border-color .15s;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(155,89,255,.12);}
.field textarea{resize:vertical;min-height:70px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid transparent;font-family:inherit;transition:all .15s;white-space:nowrap;}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:var(--white);}
.btn-primary:hover{opacity:.9;}
.btn-ghost{background:var(--white);color:var(--gray-800);border-color:var(--gray-200);}
.btn-ghost:hover{background:var(--gray-50);}
.btn-danger{background:var(--red-light);color:var(--red);border-color:var(--red);}
.btn-danger:hover{opacity:.85;}
.btn-success{background:var(--green-light);color:#166534;border-color:var(--green);}
.btn-full{width:100%;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.err{background:var(--red-light);color:var(--red);border:1px solid var(--red);border-radius:var(--radius);padding:10px 14px;font-size:13px;margin-bottom:14px;display:none;}

/* APP SHELL */
#app{display:none;min-height:100vh;}

/* SIDEBAR */
.sidebar{position:fixed;top:0;left:0;width:var(--sidebar);height:100vh;background:var(--white);border-right:1px solid var(--gray-100);display:flex;flex-direction:column;z-index:100;transition:transform .2s;}
.sb-logo{padding:16px 18px;border-bottom:1px solid var(--gray-100);display:flex;align-items:center;gap:10px;}
.sb-logo img{width:32px;height:32px;border-radius:8px;}
.sb-logo span{font-size:17px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,var(--brand),var(--brand2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sb-nav{flex:1;padding:10px 8px;overflow-y:auto;}
.sb-section{font-size:10px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.8px;padding:10px 10px 4px;}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--gray-600);font-size:13px;font-weight:500;margin-bottom:1px;transition:all .15s;border:none;background:none;font-family:inherit;width:100%;text-align:left;}
.sb-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.sb-item:hover{background:var(--brand-light);color:var(--brand);}
.sb-item.active{background:var(--brand-light);color:var(--brand);font-weight:700;}
.sb-badge{margin-left:auto;background:var(--red);color:var(--white);border-radius:20px;font-size:10px;font-weight:700;padding:1px 6px;min-width:18px;text-align:center;}
.sb-user{padding:12px 14px;border-top:1px solid var(--gray-100);}
.sb-user-row{display:flex;align-items:center;gap:10px;}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--white);flex-shrink:0;}
.av-purple{background:linear-gradient(135deg,var(--brand),var(--brand2));}
.av-amber{background:#F59E0B;}
.av-blue{background:#3B82F6;}
.av-coral{background:#EF4444;}
.user-info{flex:1;min-width:0;}
.user-name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.user-role{font-size:11px;color:var(--gray-400);}
.btn-logout{background:none;border:none;cursor:pointer;color:var(--gray-400);padding:4px;font-size:17px;line-height:1;}
.btn-logout:hover{color:var(--red);}

/* MAIN */
.main{margin-left:var(--sidebar);min-height:100vh;display:flex;flex-direction:column;}
.topbar{height:56px;background:var(--white);border-bottom:1px solid var(--gray-100);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:50;}
.topbar-left{display:flex;align-items:center;gap:12px;}
.topbar-title{font-size:15px;font-weight:700;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.live-clock{font-size:12px;font-weight:600;color:var(--gray-600);background:var(--gray-100);padding:5px 12px;border-radius:20px;font-variant-numeric:tabular-nums;}
.content{padding:24px;flex:1;max-width:1200px;}

/* PAGES */
.page{display:none;}
.page.active{display:block;}
.page-hdr{margin-bottom:20px;}
.page-hdr h2{font-size:22px;font-weight:800;letter-spacing:-.5px;}
.page-hdr p{font-size:13px;color:var(--gray-400);margin-top:3px;}

/* CARDS */
.card{background:var(--white);border:1px solid var(--gray-100);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px;}
.card-hdr{padding:13px 18px;border-bottom:1px solid var(--gray-100);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;}
.card-body{padding:16px 18px;}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.stat{background:var(--white);border:1px solid var(--gray-100);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);}
.stat-lbl{font-size:10px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.stat-num{font-size:32px;font-weight:800;letter-spacing:-1.5px;background:linear-gradient(135deg,var(--brand),var(--brand2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.stat-sub{font-size:11px;color:var(--gray-400);margin-top:3px;}

/* TABLE */
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:11px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.5px;padding:10px 14px;background:var(--gray-50);border-bottom:1px solid var(--gray-100);}
td{padding:11px 14px;border-bottom:1px solid var(--gray-100);font-size:13px;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:var(--gray-50);}

/* PILLS */
.pill{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.pill-new{background:#EEF2FF;color:#4338CA;}
.pill-tablet{background:var(--amber-light);color:#92400E;}
.pill-onboard{background:var(--brand-light);color:var(--brand-text);}
.pill-integration{background:#FEF9C3;color:#854D0E;}
.pill-menu{background:#FCE7F3;color:#9D174D;}
.pill-optimization{background:#E0F2FE;color:#075985;}
.pill-live{background:var(--green-light);color:#166534;}
.pill-pending{background:var(--amber-light);color:#92400E;}
.pill-shipped{background:var(--brand-light);color:var(--brand-text);}
.pill-owner{background:#EEF2FF;color:#4338CA;}
.pill-sales{background:var(--amber-light);color:#92400E;}
.pill-onboarding{background:var(--brand-light);color:var(--brand-text);}

/* PROGRESS */
.prog-bar{height:4px;background:var(--gray-100);border-radius:2px;margin-top:5px;overflow:hidden;width:80px;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:2px;transition:width .4s;}

/* CHECKLIST */
.checklist{display:flex;flex-direction:column;gap:8px;}
.ck-step{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1.5px solid var(--gray-200);border-radius:var(--radius);transition:all .15s;}
.ck-step.done{background:var(--green-light);border-color:#86EFAC;}
.ck-step.locked{opacity:.35;cursor:not-allowed;}
.ck-step.cur{border-color:var(--brand);background:var(--brand-light);cursor:pointer;}
.ck-step.cur:hover{opacity:.85;}
.ck-circle{width:22px;height:22px;border-radius:50%;border:2px solid var(--gray-200);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:700;margin-top:1px;}
.ck-step.done .ck-circle{background:var(--green);border-color:var(--green);color:var(--white);}
.ck-step.cur .ck-circle{border-color:var(--brand);color:var(--brand);}
.ck-info{flex:1;}
.ck-title{font-size:13px;font-weight:700;}
.ck-desc{font-size:12px;color:var(--gray-400);margin-top:2px;}

/* BRANDS */
.brand-cat{margin-bottom:14px;}
.brand-cat-lbl{font-size:12px;font-weight:700;color:var(--gray-600);margin-bottom:7px;}
.brand-chips{display:flex;flex-wrap:wrap;gap:5px;}
.chip{padding:4px 11px;border:1.5px solid var(--gray-200);border-radius:20px;font-size:12px;cursor:pointer;color:var(--gray-600);background:var(--white);transition:all .15s;user-select:none;}
.chip.sel{border-color:var(--brand);background:var(--brand-light);color:var(--brand-text);font-weight:600;}

/* NOTIF */
.notif-row{display:flex;gap:12px;padding:13px 18px;border-bottom:1px solid var(--gray-100);transition:background .1s;cursor:pointer;}
.notif-row:last-child{border-bottom:none;}
.notif-row.unread{background:#FAF7FF;}
.notif-row:hover{background:var(--gray-50);}
.notif-ico{width:36px;height:36px;border-radius:50%;background:var(--brand-light);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.notif-body{flex:1;}
.notif-txt{font-size:13px;line-height:1.4;}
.notif-time{font-size:11px;color:var(--gray-400);margin-top:3px;}
.unread-dot{width:7px;height:7px;border-radius:50%;background:var(--brand);margin-top:6px;flex-shrink:0;}

/* CLOCK */
.clock-hero{background:linear-gradient(135deg,var(--brand),var(--brand2));border-radius:16px;padding:22px;color:var(--white);margin-bottom:16px;}
.clock-time-big{font-size:44px;font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums;}
.clock-date-txt{font-size:13px;opacity:.8;margin-top:4px;}
.clock-status{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;font-weight:600;}
.clock-dot{width:9px;height:9px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 2px rgba(74,222,128,.3);}
.clock-dot.off{background:rgba(255,255,255,.35);box-shadow:none;}
.clock-btns{display:flex;gap:10px;margin-top:16px;}
.btn-cin{background:var(--white);color:var(--brand);border:none;padding:10px 22px;border-radius:var(--radius);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-cin:hover{opacity:.9;}
.btn-cout{background:rgba(255,255,255,.15);color:var(--white);border:1.5px solid rgba(255,255,255,.3);padding:10px 22px;border-radius:var(--radius);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-cout:hover{background:rgba(255,255,255,.25);}

/* ONLINE */
.online-wrap{display:flex;flex-wrap:wrap;gap:10px;}
.online-card{display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--gray-100);border-radius:10px;padding:8px 12px;box-shadow:var(--shadow);}
.online-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.online-dot.on{background:var(--green);box-shadow:0 0 0 2px rgba(34,197,94,.2);}
.online-dot.off{background:var(--gray-200);}

/* DETAIL ROW */
.drow{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--gray-100);font-size:13px;}
.drow:last-child{border-bottom:none;}
.dlbl{color:var(--gray-400);font-weight:600;width:130px;flex-shrink:0;}
.dval{color:var(--gray-800);flex:1;word-break:break-word;}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:none;align-items:center;justify-content:center;padding:1rem;}
.overlay.open{display:flex;}
.modal{background:var(--white);border-radius:20px;width:100%;max-width:700px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal-hdr{padding:18px 22px;border-bottom:1px solid var(--gray-100);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--white);z-index:10;}
.modal-title{font-size:17px;font-weight:800;}
.modal-close{width:30px;height:30px;border-radius:50%;background:var(--gray-100);border:none;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--gray-600);}
.modal-body{padding:20px 22px;}

/* ADMIN */
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;}
.admin-card{background:var(--white);border:1px solid var(--gray-100);border-radius:14px;padding:18px;box-shadow:var(--shadow);cursor:pointer;transition:all .15s;}
.admin-card:hover{border-color:var(--brand);box-shadow:0 4px 16px rgba(155,89,255,.15);}
.admin-card-ico{font-size:28px;margin-bottom:10px;}
.admin-card-title{font-size:14px;font-weight:700;margin-bottom:4px;}
.admin-card-desc{font-size:12px;color:var(--gray-400);}

/* GRID */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}

/* FILTER TABS */
.filter-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}

/* DIVIDER */
.divider{height:1px;background:var(--gray-100);margin:14px 0;}
.sec-lbl{font-size:11px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 8px;}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--gray-800);color:var(--white);padding:11px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:all .25s;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* EMPTY */
.empty{text-align:center;padding:2.5rem 1rem;color:var(--gray-400);}
.empty-ico{font-size:36px;margin-bottom:10px;}
.empty p{font-size:14px;font-weight:600;color:var(--gray-600);}
.empty span{font-size:12px;}

/* MOBILE */
@media(max-width:768px){
  .sidebar{width:100%;height:auto;position:fixed;bottom:0;top:auto;border-right:none;border-top:1px solid var(--gray-100);flex-direction:row;z-index:100;}
  .sb-logo,.sb-user,.sb-section{display:none;}
  .sb-nav{display:flex;padding:4px;overflow-x:auto;gap:0;}
  .sb-item{flex-direction:column;gap:2px;font-size:10px;padding:8px 10px;min-width:56px;border-radius:8px;}
  .sb-item svg{width:20px;height:20px;}
  .sb-badge{position:absolute;top:4px;right:6px;}
  .sb-item{position:relative;}
  .main{margin-left:0;padding-bottom:68px;}
  .content{padding:14px;}
  .stats-row{grid-template-columns:1fr 1fr;}
  .g2,.g3{grid-template-columns:1fr;}
  .topbar{padding:0 14px;}
  .field-row{grid-template-columns:1fr;}
}
</style>
</head>

  lang=l;
  localStorage.setItem('bc_lang',l);
  // Update login screen buttons
  applyLangUI();
  // Update topbar button (lang is now set, so use it correctly)
  var tl=document.getElementById('topbar-lang');

  var active=document.querySelector('.sb-item.active');

  }
}

var db,auth,currentUser,CU; // CU = currentUserInfo
var restaurants=[],tablets=[],notifs=[],leads=[];
var pipeFilter='all';
var clockedIn=false;

// ==========================================
// INIT
// ==========================================
window.addEventListener('load',function(){
  try{
    firebase.initializeApp(FB);
    db=firebase.firestore();
    auth=firebase.auth();
    auth.onAuthStateChanged(function(u){
      document.getElementById('loading').style.display='none';
      if(u&&TEAM[u.email]){currentUser=u;CU=TEAM[u.email];startApp();}
      else{if(u)auth.signOut();showLogin();}
    });
  }catch(e){document.getElementById('loading').style.display='none';showLogin();}
});

function showLogin(){document.getElementById('login-screen').style.display='flex';}

function startApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  // Avatar
  document.getElementById('sb-av').textContent=CU.initials;
  document.getElementById('sb-av').className='avatar '+CU.av;
  document.getElementById('sb-name').textContent=CU.name;
  document.getElementById('sb-role').textContent=roleLabel(CU.role);
  buildNav();
  renderDashboard();
  startClock();
  updatePresence();
  loadData();
  // Apply language
  applyLangUI();
  var tl=document.getElementById('topbar-lang');
  if(tl)tl.textContent=lang==='fr'?'🇫🇷 FR':'🇬🇧 EN';
}

var PAGE_TITLES={dashboard:'Dashboard',add:'Add Restaurant',pipeline:'Pipeline',tablet:'Tablet Request',notifications:'Notifications',clock:'Clock In/Out',team:'Team',admin:'Admin Panel'};

function showPage(name,btn){
  document.querySelectorAll('.sb-item').forEach(function(b){b.classList.remove('active');});
  if(btn)btn.classList.add('active');
  else{var nb=document.getElementById('nav-'+name);if(nb)nb.classList.add('active');}
  document.getElementById('topbar-title').textContent=getPageTitle(name);
  
  var renders={
    dashboard:renderDashboard,
    add:renderAdd,
    pipeline:renderPipeline,
    tablet:renderTablet,
    leads:renderLeads,
    wallet:renderWallet,
    notifications:renderNotifications,
    clock:renderClock,
    team:renderTeam,
    admin:renderAdmin
  };
  var c=document.getElementById('content');
  c.innerHTML='';
  if(renders[name])renders[name]();
  window.scrollTo(0,0);
}

// ==========================================
// LIVE CLOCK
// ==========================================
function startClock(){
  function tick(){
    var now=new Date();
    var t=now.toLocaleTimeString('en-CA',{hour12:false});
    var el=document.getElementById('live-clock');
    if(el)el.textContent=t;
    var cb=document.getElementById('clock-big');
    if(cb)cb.textContent=t;
  }
  tick();setInterval(tick,1000);
}

// ==========================================
// PRESENCE (real online detection)
// ==========================================
var presenceUnsub=null;
function updatePresence(){
  if(!db||!currentUser)return;
  var ref=db.collection('presence').doc(currentUser.uid);
  ref.set({name:CU.name,email:currentUser.email,role:CU.role,initials:CU.initials,av:CU.av,lastSeen:firebase.firestore.FieldValue.serverTimestamp(),online:true},{merge:true});
  // Update every 45 seconds
  setInterval(function(){ref.update({lastSeen:firebase.firestore.FieldValue.serverTimestamp()});},45000);
  // Mark offline on close
  window.addEventListener('beforeunload',function(){ref.update({online:false,lastSeen:firebase.firestore.FieldValue.serverTimestamp()});});
}

// ==========================================
// LOAD DATA
// ==========================================
function loadData(){
  db.collection('restaurants').orderBy('createdAt','desc').onSnapshot(function(s){
    restaurants=[];s.forEach(function(d){restaurants.push(Object.assign({id:d.id},d.data()));});
    refreshCurrentPage();
  });
  db.collection('leads').orderBy('createdAt','desc').onSnapshot(function(s){
    leads=[];s.forEach(function(d){leads.push(Object.assign({id:d.id},d.data()));});
    var al=document.querySelector('.sb-item.active');
    if(al&&al.id==='nav-leads')renderLeads();
  });
  db.collection('tablets').orderBy('createdAt','desc').onSnapshot(function(s){
    tablets=[];s.forEach(function(d){tablets.push(Object.assign({id:d.id},d.data()));});
    refreshCurrentPage();
  });
  db.collection('notifications').orderBy('createdAt','desc').limit(60).onSnapshot(function(s){
    notifs=[];s.forEach(function(d){notifs.push(Object.assign({id:d.id},d.data()));});
    updateBadge();
    var active=document.querySelector('.sb-item.active');
    if(active&&active.id==='nav-notifications')renderNotifications();
    // refresh dash activity
    var da=document.getElementById('dash-activity');
    if(da)renderDashActivity();
  });
}

function refreshCurrentPage(){
  var active=document.querySelector('.sb-item.active');
  if(!active)return;
  var id=active.id.replace('nav-','');
  var refreshable=['dashboard','pipeline','tablet','team'];
  if(refreshable.indexOf(id)>-1){
    var renders={dashboard:renderDashboard,pipeline:renderPipeline,tablet:renderTablet,leads:renderLeads,wallet:renderWallet,team:renderTeam};
    if(renders[id])renders[id]();
  }
}

    ?restaurants.filter(function(r){return r.status!=='live';})
    :restaurants.filter(function(r){

      });

    +'<div class="stat"><div class="stat-lbl">'+t('live')+'</div><div class="stat-num">'+restaurants.filter(function(r){return r.status==='live';}).length+'</div><div class="stat-sub">'+t('active_loc')+'</div></div>'

      +'<div class="card"><div id="my-tasks-body">'
      +(myRest.length?'<div class="tbl-wrap"><table><thead><tr><th>Restaurant</th><th>Step</th><th></th></tr></thead><tbody>'

            +'<td><span class="pill '+(STEP_PILLS[s]||'pill-new')+'">'+(STEP_LABELS[s]||'New')+'</span></td>'
            +'<td style="color:var(--gray-400);font-size:12px;">'+timeAgo(r.createdAt)+'</td></tr>';
        }).join('')+'</tbody></table></div>'
        :'<div class="empty" style="padding:1rem;"><p>'+t('no_assign')+'</p></div>')

  document.getElementById('content').innerHTML=

    +'<div class="card" id="dash-activity"><div class="empty" style="padding:1.5rem;"><div class="spin" style="margin:0 auto 10px;width:24px;height:24px;border-width:2px;"></div><p>Loading…</p></div></div>'

function renderMyRestaurants(){
  // Show sales person their own restaurants (tablets they submitted + restaurants created from those)
  var myTablets=tablets.filter(function(tb){return tb.submittedBy===CU.name;});
  var myRests=restaurants.filter(function(r){return r.submittedBy===CU.name;});

  var el=document.getElementById('my-restos-dash');
  if(!el)return;

  if(!myTablets.length&&!myRests.length){
    el.innerHTML='<div class="empty" style="padding:1rem;"><p>No restaurants yet</p></div>';
    return;
  }

  // Build combined list: restaurants first, then tablets not yet in pipeline
  var restNames=new Set(myRests.map(function(r){return (r.name||'').toLowerCase().trim();}));
  var pendingTabs=myTablets.filter(function(tb){return !restNames.has((tb.restaurantName||'').toLowerCase().trim());});

  var rows='';
  myRests.forEach(function(r){
    var s=r.stepIndex||0;
    var pill=r.status==='live'?'pill-live':(STEP_PILLS[s]||'pill-new');
    var lbl=r.status==='live'?'✓ Live':(STEP_LABELS[s]||'New');
    rows+='<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--gray-100);">'
      +'<div><div style="font-size:13px;font-weight:700;">'+esc(r.name)+'</div>'
      +'<div style="font-size:11px;color:var(--gray-400);">'+esc(r.ownerName||'')+(r.phone?' · '+esc(r.phone):'')+'</div></div>'
      +'<span class="pill '+pill+'">'+lbl+'</span>'
      +'</div>';
  });
  pendingTabs.forEach(function(tb){
    var stlbl=tb.status==='shipped'?'📦 Shipped':'⏳ Pending';
    var stcol=tb.status==='shipped'?'var(--brand)':'var(--amber)';
    rows+='<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--gray-100);">'
      +'<div><div style="font-size:13px;font-weight:700;">'+esc(tb.restaurantName)+'</div>'
      +'<div style="font-size:11px;color:var(--gray-400);">'+esc(tb.ownerName||'')+(tb.phone?' · '+esc(tb.phone):'')+'</div></div>'
      +'<span style="font-size:11px;font-weight:700;color:'+stcol+';">'+stlbl+'</span>'
      +'</div>';
  });

  el.innerHTML='<div class="card-body">'+rows+'</div>';
}

function renderDashActivity(){
  var el=document.getElementById('dash-activity');
  if(!el)return;
  var ICONS={new:'🏪',live:'🚀',tablet:'📦',step:'✅',clock:'⏱',system:'📢'};
  // Filter notifications by role
  var filtered=notifs.filter(function(n){
    if(CU.role==='owner')return true;
    if(CU.role==='onboarding')return (n.type==='step'&&n.createdBy===CU.name)||(n.type==='live'&&n.createdBy===CU.name)||(n.type==='clock'&&n.createdBy===CU.name);
    if(CU.role==='sales')return (n.type==='tablet'&&n.createdBy===CU.name)||(n.type==='clock'&&n.createdBy===CU.name)||(n.type==='new'&&n.message&&n.message.indexOf(CU.name)>=0);
    return false;
  });
  if(!filtered.length){el.innerHTML='<div class="empty" style="padding:1.5rem;"><p>No activity yet</p></div>';return;}
  el.innerHTML=filtered.slice(0,6).map(function(n){
    return '<div class="notif-row"><div class="notif-ico">'+(ICONS[n.type]||'📢')+'</div>'
      +'<div class="notif-body"><div class="notif-txt">'+esc(n.message)+'</div><div class="notif-time">'+timeAgo(n.createdAt)+'</div></div></div>';
  }).join('');
}

function renderOnlineGrid(){
  var el=document.getElementById('online-grid');
  if(!el)return;
  // Check presence collection — online if lastSeen within 90 seconds
  // Build set of valid team emails
  var validNames=new Set(Object.values(TEAM).map(function(t){return t.name;}));
  db.collection('presence').onSnapshot(function(snap){
    var now=Date.now();
    var html='';
    snap.forEach(function(doc){
      var d=doc.data();
      // Only show people still in the TEAM object
      if(!validNames.has(d.name))return;
      var ts=d.lastSeen?d.lastSeen.toDate().getTime():0;
      var online=(now-ts)<90000;
      var isOwnerView=(CU&&CU.role==='owner');
      html+='<div class="online-card">';
      if(isOwnerView)html+='<div class="online-dot '+(online?'on':'off')+'" style="flex-shrink:0;"></div>';
      html+='<div class="avatar '+(d.av||'av-purple')+'" style="width:28px;height:28px;font-size:13px;font-weight:700;">'+esc((d.name||'?')[0].toUpperCase())+'</div>';
      if(isOwnerView)html+='<div><div style="font-size:13px;font-weight:600;">'+esc(d.name)+'</div><div style="font-size:10px;color:'+(online?'var(--green)':'var(--gray-400)')+';">'+(online?'Online':'Offline')+'</div></div>';
      html+='</div>';
    });
    if(el)el.innerHTML=html||'<p style="color:var(--gray-400);font-size:13px;">No one online yet</p>';
  });
}

function renderClockLogDash(){
  var today=new Date().toISOString().slice(0,10);
  db.collection('clock').where('date','==',today).orderBy('clockIn','desc').get().then(function(snap){
    var el=document.getElementById('clock-log-dash');
    if(!el)return;
    if(snap.empty){el.innerHTML='<div class="card-body" style="color:var(--gray-400);font-size:13px;">No clock entries today.</div>';return;}
    var rows='';
    snap.forEach(function(doc){
      var d=doc.data();
      var inT=d.clockIn?d.clockIn.toDate().toLocaleTimeString('en-CA',{hour12:false,hour:'2-digit',minute:'2-digit'}):'–';
      var outT=d.clockOut?d.clockOut.toDate().toLocaleTimeString('en-CA',{hour12:false,hour:'2-digit',minute:'2-digit'}):'Still in';
      var dur='';
      if(d.clockIn&&d.clockOut){var ms=d.clockOut.toDate()-d.clockIn.toDate();var h=Math.floor(ms/3600000);var m=Math.floor((ms%3600000)/60000);dur=' · '+h+'h'+m+'m';}
      rows+='<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--gray-100);font-size:13px;">'
        +'<span style="font-weight:600;">'+esc(d.userName)+'</span>'
        +'<span style="color:var(--gray-400);">'+inT+' → '+outT+dur+'</span></div>';
    });
    el.innerHTML='<div class="card-body">'+rows+'</div>';
  }).catch(function(){});
}

function submitRestaurant(){

    platforms:platforms,brands:brands,
    status:'new',stepIndex:0,
    submittedBy:CU.name,
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    addNotif('new','🏪 '+CU.name+' added '+name+' → assigned to '+agent);
    sendEmail('New Restaurant', CU.name, '🏪 '+CU.name+' added: '+name+' | Owner: '+owner+' | Agent: '+agent);
    showToast('✅ Submitted! '+agent+' notified.');
    showPage('pipeline',document.getElementById('nav-pipeline'));
  }).catch(function(e){showToast('❌ '+e.message);btn.disabled=false;btn.textContent='✅ Submit & notify team';});
}

      return '<tr onclick="openResto(\''+r.id+'\')" style="cursor:pointer">'

        +'<td>'+esc(r.ownerName)+'<div style="font-size:11px;color:var(--gray-400);">'+esc(r.phone||'')+'</div></td>'
        +'<td>'+esc(r.agent)+'</td>'
        +'<td><span class="pill '+pill+'">'+lbl+'</span><div class="prog-bar"><div class="prog-fill" style="width:'+pct+'%"></div></div></td>'

function openResto(id){
  var r=restaurants.find(function(x){return x.id===id;});
  if(!r)return;
  var step=r.stepIndex||0;
  var notes=r.stepNotes||{};
  var currentStepDef=STEPS[step]||{};
  var isMyStep=CU.role==='owner'||(CU.name==='Saber'&&currentStepDef.who==='Saber')||(CU.name==='Zayd'&&currentStepDef.who==='Zayd');

  var stepsHtml=STEPS.map(function(s,i){
    var done=i<step;
    var cur=i===step&&r.status!=='live';
    var locked=i>step;
    var noteVal=notes[i]||'';
    var whoColor=s.who==='Zayd'?'#92400E':s.who==='Owner'?'#4338CA':'var(--brand-text)';
    var whoBg=s.who==='Zayd'?'var(--amber-light)':s.who==='Owner'?'#EEF2FF':'var(--brand-light)';
    var whoTag='<span style="font-size:10px;font-weight:700;background:'+whoBg+';color:'+whoColor+';padding:2px 7px;border-radius:20px;margin-left:6px;">'+s.who+'</span>';
    var cls='ck-step'+(done?' done':cur?' cur':'');
    var noteHtml='';
    if(done&&noteVal){
      noteHtml='<div style="margin-top:6px;font-size:11px;background:rgba(0,0,0,.04);border-radius:6px;padding:6px 8px;color:var(--gray-600);">📝 '+esc(noteVal)+'</div>';
    }
    var canDoThis=CU.role==='owner'||(CU.name==='Saber'&&s.who==='Saber')||(CU.name==='Zayd'&&s.who==='Zayd');
    if(cur&&r.status!=='live'){
      if(canDoThis){
        noteHtml='<div style="margin-top:8px;">'
          +'<textarea id="step-note-'+i+'" placeholder="'+esc(s.note)+'" style="width:100%;padding:8px;border:1.5px solid var(--brand);border-radius:8px;font-size:12px;font-family:inherit;resize:vertical;min-height:60px;">'+esc(noteVal)+'</textarea>'
          +'<button onclick="completeStep(\''+id+'\','+i+')" class="btn btn-primary btn-full" style="margin-top:8px;">✅ Complete → Next Step</button>'
          +'</div>';
      } else {
        noteHtml='<div style="margin-top:6px;font-size:12px;color:var(--amber);font-weight:600;">⏳ Waiting for '+s.who+' to complete this step</div>';
      }
    }
    return '<div class="'+cls+'" style="'+(locked?'opacity:.35;':'')+'">'
      +'<div class="ck-circle">'+((done)?'✓':(cur?'▶':(i+1)))+'</div>'
      +'<div class="ck-info" style="flex:1;">'
      +'<div class="ck-title">'+s.title+whoTag+'</div>'
      +'<div class="ck-desc">'+s.desc+'</div>'
      +noteHtml
      +'</div></div>';
  }).join('');

  var pct=Math.round((step/9)*100);
  document.getElementById('mr-title').textContent=r.name;
  document.getElementById('mr-body').innerHTML=
    '<div class="drow"><div class="dlbl">Owner</div><div class="dval">'+esc(r.ownerName)+'</div></div>'
    +'<div class="drow"><div class="dlbl">Phone</div><div class="dval"><a href="tel:'+esc(r.phone)+'" style="color:var(--brand);">'+esc(r.phone)+'</a></div></div>'
    +'<div class="drow"><div class="dlbl">Address</div><div class="dval">'+esc(r.address)+'</div></div>'
    +'<div class="drow"><div class="dlbl">Brands</div><div class="dval" style="font-size:12px;line-height:1.6;">'+(r.brands||[]).join(' · ')+'</div></div>'
    +(r.notes?'<div class="drow"><div class="dlbl">Notes</div><div class="dval">'+esc(r.notes)+'</div></div>':'')
    +'<div class="divider"></div>'
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">'
    +'<div style="font-size:13px;font-weight:700;">Step '+(Math.min(step+1,9))+' of 9'+(r.status==='live'?' <span class=\"pill pill-live\">✓ LIVE</span>':'')+'</div>'
    +'<div style="font-size:13px;font-weight:700;color:var(--brand);">'+pct+'%</div></div>'
    +'<div style="height:6px;background:var(--gray-100);border-radius:3px;margin-bottom:16px;overflow:hidden;"><div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:3px;"></div></div>'
    +'<div class="checklist">'+stepsHtml+'</div>'
    +(r.status==='live'?'<div style="margin-top:14px;text-align:center;padding:12px;background:var(--green-light);border-radius:10px;font-weight:700;color:#166534;">🎉 This restaurant is LIVE!</div>':'');
  openModal('modal-resto');
}

function completeStep(id,stepIndex){
  var r=restaurants.find(function(x){return x.id===id;});
  if(!r)return;
  var noteEl=document.getElementById('step-note-'+stepIndex);
  var noteText=noteEl?noteEl.value.trim():'';
  if(!noteText){showToast('⚠️ Please write a note first');return;}
  var newStep=stepIndex+1;
  var notes=r.stepNotes||{};
  notes[stepIndex]=noteText;
  var isLive=newStep>=9;
  var updateData={stepIndex:newStep,stepNotes:notes};
  if(isLive)updateData.status='live';
  db.collection('restaurants').doc(id).update(updateData).then(function(){
    var doneTitle=STEPS[stepIndex]?STEPS[stepIndex].title:'step';
    var nextDef=STEPS[newStep];
    var msg='✅ '+CU.name+' completed "'+doneTitle+'" for '+r.name;
    if(nextDef)msg+=' → Next: '+nextDef.title+' ('+nextDef.who+')';
    addNotif('step',msg);
    if(stepIndex===6){
      sendEmail('Ready for Review: '+r.name,CU.name,'🔔 '+r.name+' ready for review. Completed by: '+CU.name+'. Note: '+noteText);
    }
    if(isLive){
      addNotif('live','🚀 '+r.name+' is now LIVE! 🎉');
      sendEmail('LIVE: '+r.name,CU.name,'🚀 '+r.name+' is now LIVE! Marketing starts now.');
    }
    showToast(isLive?'🚀 LIVE!':'✅ Done! Next: '+(nextDef?nextDef.title:'Complete'));
    closeModal('modal-resto');
  });
}

function submitTablet(){
  // Sales users must have an approved lead
  if(CU.role==='sales'){
    var myApproved=leads.filter(function(l){return l.status==='approved'&&l.submittedBy===CU.name;});
    var tabNames=new Set(tablets.map(function(tb){return (tb.restaurantName||'').toLowerCase().trim();}));
    var avail=myApproved.filter(function(l){return !tabNames.has((l.restaurantName||'').toLowerCase().trim());});
    if(!avail.length){showToast('No approved restaurant. Go to My Leads first.');return;}
  }
  var name=v('t-name'),owner=v('t-owner'),addr=v('t-addr');
  if(!name||!owner||!addr){showToast('⚠️ Fill required fields');return;}
  var btn=document.getElementById('btn-tablet');
  btn.disabled=true;btn.textContent='Sending…';
  db.collection('tablets').add({
    restaurantName:name,ownerName:owner,
    phone:v('t-phone'),address:addr,notes:v('t-notes'),
    submittedBy:CU.name,status:'pending',
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    addNotif('tablet','📦 '+CU.name+' requested tablet for '+name+' — awaiting shipment');
    sendEmail('Tablet Request', CU.name, '📦 '+CU.name+' requested tablet for: '+name+' | Address: '+addr);
    showToast('📦 Request sent! Owners notified.');
    ['t-name','t-owner','t-phone','t-addr','t-notes'].forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});
  }).catch(function(e){showToast('❌ '+e.message);})
  .finally(function(){btn.disabled=false;btn.textContent='📦 Send tablet request';});
}

function renderWallet(){
  if(CU.role!=='sales' && CU.role!=='owner'){
    document.getElementById('content').innerHTML='<div class="empty"><div class="empty-ico">🔒</div><p>Access denied</p></div>';
    return;
  }

  var myName=CU.name;

  // All leads this person submitted
  var myLeads=leads.filter(function(l){ return l.submittedBy===myName; });

  // All restaurants from their leads (matched by name or fromTablet)
  var myRests=restaurants.filter(function(r){ return r.submittedBy===myName; });

  // All tablets this person submitted
  var myTablets=tablets.filter(function(tb){ return tb.submittedBy===myName; });

  if(!myLeads.length && !myTablets.length){
    document.getElementById('content').innerHTML=
      '<div class="page-hdr"><h2>My Wallet</h2><p>All restaurants you brought to BranChef.</p></div>'
      +'<div class="empty" style="padding:3rem;"><div class="empty-ico">💼</div><p>No restaurants yet</p><span>Submit a lead to get started</span></div>';
    return;
  }

  // Build unified list — one card per lead (contract + tablet + onboarding)
  var cards = myLeads.map(function(lead){
    // Find matching tablet
    var tablet=myTablets.find(function(tb){
      return (tb.restaurantName||'').toLowerCase().trim() === (lead.restaurantName||'').toLowerCase().trim();
    });
    // Find matching restaurant (onboarding pipeline)
    var rest=myRests.find(function(r){
      return (r.name||'').toLowerCase().trim() === (lead.restaurantName||'').toLowerCase().trim();
    });

    return buildWalletCard(lead, tablet, rest);
  }).join('');

  // Tablets submitted without a lead (old style)
  var leadNames=new Set(myLeads.map(function(l){ return (l.restaurantName||'').toLowerCase().trim(); }));
  var orphanTablets=myTablets.filter(function(tb){
    return !leadNames.has((tb.restaurantName||'').toLowerCase().trim());
  });
  var orphanCards=orphanTablets.map(function(tb){
    var rest=myRests.find(function(r){
      return (r.name||'').toLowerCase().trim() === (tb.restaurantName||'').toLowerCase().trim();
    });
    return buildWalletCard(null, tb, rest);
  }).join('');

  var total=myLeads.length + orphanTablets.length;
  var live=myRests.filter(function(r){ return r.status==='live'; }).length;
  var approved=myLeads.filter(function(l){ return l.status==='approved'; }).length;

  document.getElementById('content').innerHTML=
    '<div class="page-hdr"><h2>💼 My Wallet</h2><p>Every restaurant you brought to BranChef — from contract to live.</p></div>'
    +'<div class="stats-row" style="margin-bottom:20px;">'
    +'<div class="stat"><div class="stat-lbl">Total</div><div class="stat-num">'+total+'</div><div class="stat-sub">Restaurants</div></div>'
    +'<div class="stat"><div class="stat-lbl">Approved</div><div class="stat-num" style="color:#059669;">'+approved+'</div><div class="stat-sub">By Nadir</div></div>'
    +'<div class="stat"><div class="stat-lbl">Live</div><div class="stat-num" style="color:var(--brand);">'+live+'</div><div class="stat-sub">Active</div></div>'
    +'</div>'
    +'<div style="display:flex;flex-direction:column;gap:12px;">'
    +cards + orphanCards
    +'</div>';
}

function buildWalletCard(lead, tablet, rest){
  var name = (lead&&lead.restaurantName) || (tablet&&tablet.restaurantName) || (rest&&rest.name) || '—';
  var owner= (lead&&lead.ownerName) || (tablet&&tablet.ownerName) || (rest&&rest.ownerName) || '—';
  var phone= (lead&&lead.phone) || (tablet&&tablet.phone) || (rest&&rest.phone) || '—';
  var addr = (lead&&lead.address) || (tablet&&tablet.address) || (rest&&rest.address) || '—';

  // ─ CONTRACT status ─
  var contractStatus='', contractColor='', contractIcon='';
  if(!lead){
    contractStatus='No contract'; contractColor='#aaa'; contractIcon='📋';
  } else if(lead.status==='rejected'){
    contractStatus='Rejected'+(lead.rejectReason?' — '+lead.rejectReason:''); contractColor='#dc2626'; contractIcon='❌';
  } else if(lead.status==='approved'){
    contractStatus='Approved by Nadir'; contractColor='#059669'; contractIcon='✅';
  } else if(lead.status==='signed'||lead.status==='pending_approval'){
    contractStatus='Signed — awaiting Nadir'; contractColor='#2563eb'; contractIcon='✍️';
  } else {
    contractStatus='Contract sent — waiting signature'; contractColor='#b45309'; contractIcon='⏳';
  }

  // ─ TABLET status ─
  var tabletStatus='', tabletColor='', tabletIcon='';
  if(!tablet){
    tabletStatus='No tablet request yet'; tabletColor='#aaa'; tabletIcon='📦';
  } else if(tablet.status==='shipped'){
    tabletStatus='Tablet shipped'+(tablet.shippedBy?' by '+tablet.shippedBy:''); tabletColor='var(--brand)'; tabletIcon='📦';
  } else {
    tabletStatus='Tablet requested — awaiting shipment'; tabletColor='#b45309'; tabletIcon='⏳';
  }

  // ─ ONBOARDING/LIVE status ─
  var onboardStatus='', onboardColor='', onboardIcon='';
  if(!rest){
    onboardStatus='Not in pipeline yet'; onboardColor='#aaa'; onboardIcon='🏪';
  } else if(rest.status==='live'){
    onboardStatus='LIVE ✓'; onboardColor='#059669'; onboardIcon='🚀';
  } else {
    var s=rest.stepIndex||0;
    onboardStatus='Onboarding: '+(STEP_LABELS[s]||'Step '+s)+' ('+Math.round((s/8)*100)+'%)';
    onboardColor='var(--brand)'; onboardIcon='⚙️';
  }

  var isLive=rest&&rest.status==='live';
  var borderColor=isLive?'#86efac':( (lead&&lead.status==='approved')?'#a5b4fc':'var(--gray-100)');

  return '<div style="border:1.5px solid '+borderColor+';border-radius:14px;padding:16px 18px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06);">'
    // Header
    +'<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;">'
    +'<div>'
    +'<div style="font-size:15px;font-weight:800;color:var(--gray-800);">'+esc(name)+'</div>'
    +'<div style="font-size:12px;color:var(--gray-500);margin-top:2px;">👤 '+esc(owner)+' · 📞 '+esc(phone)+'</div>'
    +'<div style="font-size:12px;color:var(--gray-400);">📍 '+esc(addr)+'</div>'
    +'</div>'
    +(isLive?'<span style="background:#dcfce7;color:#166534;font-size:11px;font-weight:800;padding:4px 12px;border-radius:20px;">🚀 LIVE</span>':'')
    +'</div>'
    // Progress steps

function submitLead(){
  var rname = document.getElementById('ld-rname').value.trim();
  var owner = document.getElementById('ld-owner').value.trim();
  var email = document.getElementById('ld-email').value.trim();
  if(!rname||!owner||!email){ showToast('Fill required fields'); return; }
  var btn = document.getElementById('btn-lead');
  btn.disabled=true; btn.textContent='Sending...';
  var phone = document.getElementById('ld-phone').value.trim();
  var addr  = document.getElementById('ld-addr').value.trim();
  var notes = document.getElementById('ld-notes').value.trim();

  db.collection('leads').add({
    restaurantName:rname, ownerName:owner, ownerEmail:email,
    phone:phone, address:addr, notes:notes,
    submittedBy:CU.name, status:'pending',
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    // Notify Nadir by email to send DocuSign contract
    emailjs.init(EMAILJS_KEY);
    emailjs.send(EMAILJS_SERVICE, EMAILJS_TEMPLATE, {
      title:'[BranChef] Nouveau lead — Envoyer contrat DocuSign',
      name: 'Nadir',
      message: 'Bonjour Nadir,'
        +'\n\n'+CU.name+' vient d\'ajouter un nouveau lead :'
        +'\n\n— Restaurant : '+rname
        +'\n— Proprietaire : '+owner
        +'\n— Email : '+email
        +'\n— Telephone : '+(phone||'—')
        +'\n— Adresse : '+(addr||'—')
        +(notes?'\n— Notes : '+notes:'')
        +'\n\nVeuillez envoyer le contrat BranChef via DocuSign a : '+email
        +'\n\n— BranChef App',
      email: 'branchemr@gmail.com',
      time: new Date().toLocaleTimeString('fr-CA',{hour12:false})
    }).catch(function(e){console.log('email err',e);});
    addNotif('new','📋 '+CU.name+' added lead: '+rname+' ('+owner+') — Nadir notified to send DocuSign to '+email);
    showToast('✅ Lead saved! Nadir will be notified to send DocuSign contract.');
    btn.disabled=false; btn.textContent='📋 Submit lead';
    ['ld-rname','ld-owner','ld-phone','ld-email','ld-addr','ld-notes'].forEach(function(id){
      var el=document.getElementById(id); if(el)el.value='';
    });
    renderLeads();
  }).catch(function(e){
    showToast('Error: '+e.message);
    btn.disabled=false; btn.textContent='📋 Submit lead';
  });
}

function doApproveLead(btn){
  var id   = btn.getAttribute('data-lid');
  var name = btn.getAttribute('data-lname');
  btn.disabled=true; btn.textContent='Approving...';
  db.collection('leads').doc(id).update({
    status:'approved',
    approvedBy:CU.name,
    approvedAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    addNotif('new','Approved: '+name+' - sales team can now request tablet!');
    showToast('Approved! Sales team can now request tablet for '+name);
    renderLeads();
  }).catch(function(e){ showToast('Error: '+e.message); btn.disabled=false; btn.textContent='Approve'; });
}

function doRejectLead(btn){
  var id = btn.getAttribute('data-lid');
  var reason = prompt('Reason for rejection (optional):');
  if(reason===null)return;
  db.collection('leads').doc(id).update({
    status:'rejected',
    rejectedBy:CU.name,
    rejectReason:reason||'',
    rejectedAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    showToast('Rejected');
    renderLeads();
  }).catch(function(e){ showToast('Error: '+e.message); });
}


function markShipped(id,name){
  db.collection('tablets').doc(id).update({status:'shipped'}).then(function(){
    addNotif('tablet','📦 Tablet shipped to '+name);
    showToast('📦 Marked as shipped!');
  });
}

var ICONS={new:'🏪',live:'🚀',tablet:'📦',step:'✅',clock:'⏱',system:'📢'};

    if(CU.role==='sales')return (n.type==='tablet'&&n.createdBy===CU.name)||(n.type==='clock'&&n.createdBy===CU.name)||(n.type==='new'&&n.message&&n.message.indexOf(CU.name)>=0);

  });
  var html=filtered.length?filtered.map(function(n){
    return '<div class="notif-row '+(n.read?'':'unread')+'" onclick="markRead(\''+n.id+'\')">'
      +'<div class="notif-ico">'+(ICONS[n.type]||'📢')+'</div>'
      +'<div class="notif-body"><div class="notif-txt">'+esc(n.message)+'</div><div class="notif-time">'+timeAgo(n.createdAt)+'</div></div>'
      +(n.read?'':'<div class="unread-dot"></div>')
      +'</div>';
  }).join(''):'<div class="empty" style="padding:2.5rem;"><div class="empty-ico">🔔</div><p>No notifications yet</p></div>';

  document.getElementById('content').innerHTML=
    '<div class="page-hdr"><h2>Notifications</h2><p>Your activity feed.</p></div>'
    +'<div class="card">'+html+'</div>';
}

function markRead(id){db.collection('notifications').doc(id).update({read:true});}

function updateBadge(){
  var u=notifs.filter(function(n){return !n.read;}).length;
  var b=document.getElementById('notif-badge');
  if(!b)return;
  if(u>0){b.style.display='';b.textContent=u>9?'9+':u;}else b.style.display='none';
}

function addNotif(type,msg){
  db.collection('notifications').add({type:type,message:msg,read:false,createdBy:CU.name,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
}

function renderClock(){
  document.getElementById('content').innerHTML=
    '<div class="page-hdr"><h2>Clock In / Out</h2><p>Track your working hours.</p></div>'
    +'<div class="g2">'
    +'<div>'
    +'<div class="clock-hero">'
    +'<div class="clock-time-big" id="clock-big">--:--:--</div>'
    +'<div class="clock-date-txt" id="clock-date">'+new Date().toLocaleDateString('en-CA',{weekday:'long',year:'numeric',month:'long',day:'numeric'})+'</div>'
    +'<div class="clock-status"><div class="clock-dot off" id="clock-dot"></div><span id="clock-status-txt">Checking…</span></div>'
    +'<div class="clock-btns"><button class="btn-cin" id="btn-cin" onclick="clockIn()">⏱ Clock In</button><button class="btn-cout" id="btn-cout" onclick="clockOut()" style="display:none">⏹ Clock Out</button></div>'
    +'</div>'
    +'<div class="sec-lbl">My sessions today</div>'
    +'<div class="card" id="my-sessions"><div class="card-body" style="color:var(--gray-400);font-size:13px;">Loading…</div></div>'
    +'</div>'
    +'<div>'
    +(CU.role==='owner'?'<div class="sec-lbl">Team hours today</div><div class="card" id="team-sessions"><div class="empty" style="padding:1.5rem;"><p>Loading…</p></div></div>':'')
    +'</div>'
    +'</div>';

  checkClockStatus();
  loadSessions();
}

function checkClockStatus(){
  var today=new Date().toISOString().slice(0,10);
  db.collection('clock').where('userEmail','==',currentUser.email).where('date','==',today)
    .get().then(function(snap){
      var open=null;
      snap.forEach(function(d){var data=d.data();if(data.clockIn&&!data.clockOut)open=d;});
      var dot=document.getElementById('clock-dot');
      var txt=document.getElementById('clock-status-txt');
      var cin=document.getElementById('btn-cin');
      var cout=document.getElementById('btn-cout');
      if(!dot)return;
      if(open){
        clockedIn=true;
        var inT=open.data().clockIn.toDate().toLocaleTimeString('en-CA',{hour12:false,hour:'2-digit',minute:'2-digit'});
        dot.className='clock-dot';txt.textContent='Clocked in since '+inT;
        cin.style.display='none';cout.style.display='';
      }else{
        clockedIn=false;
        dot.className='clock-dot off';txt.textContent='Not clocked in';
        cin.style.display='';cout.style.display='none';
      }
    }).catch(function(){});
}

function clockIn(){
  var today=new Date().toISOString().slice(0,10);
  db.collection('clock').add({
    userEmail:currentUser.email,userName:CU.name,role:CU.role,
    date:today,clockIn:firebase.firestore.FieldValue.serverTimestamp(),clockOut:null
  }).then(function(){
    addNotif('clock','⏱ '+CU.name+' clocked in');
    sendEmail('Clock In', CU.name, '⏱ '+CU.name+' clocked IN at '+new Date().toLocaleTimeString('en-CA',{hour12:false}));
    showToast('⏱ Clocked in!');
    checkClockStatus();loadSessions();
  }).catch(function(e){showToast('❌ '+e.message);});
}

function clockOut(){
  var today=new Date().toISOString().slice(0,10);
  db.collection('clock').where('userEmail','==',currentUser.email).where('date','==',today)
    .get().then(function(snap){
      var open=null;
      snap.forEach(function(d){var data=d.data();if(data.clockIn&&!data.clockOut)open=d;});
      if(open){
        open.ref.update({clockOut:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){
          addNotif('clock','⏹ '+CU.name+' clocked out');
          sendEmail('Clock Out', CU.name, '⏹ '+CU.name+' clocked OUT at '+new Date().toLocaleTimeString('en-CA',{hour12:false}));
          showToast('⏹ Clocked out!');
          checkClockStatus();loadSessions();
        });
      }
    }).catch(function(e){showToast('❌ '+e.message);});
}

function loadSessions(){
  var today=new Date().toISOString().slice(0,10);
  // My sessions
  db.collection('clock').where('userEmail','==',currentUser.email).where('date','==',today)
    .get().then(function(snap){
      var el=document.getElementById('my-sessions');
      if(!el)return;
      if(snap.empty){el.innerHTML='<div class="card-body" style="color:var(--gray-400);font-size:13px;">No sessions today.</div>';return;}
      var rows='';
      snap.forEach(function(d){
        var data=d.data();
        var inT=data.clockIn?data.clockIn.toDate().toLocaleTimeString('en-CA',{hour12:false,hour:'2-digit',minute:'2-digit'}):'–';
        var outT=data.clockOut?data.clockOut.toDate().toLocaleTimeString('en-CA',{hour12:false,hour:'2-digit',minute:'2-digit'}):'Still working';
        rows+='<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--gray-100);font-size:13px;">'
          +'<span>Clock in: <strong>'+inT+'</strong></span><span>Out: <strong>'+outT+'</strong></span></div>';
      });
      el.innerHTML='<div class="card-body">'+rows+'</div>';
    }).catch(function(){});

  // Team sessions (owner only)
  if(CU.role==='owner'){
    db.collection('clock').where('date','==',today).get().then(function(snap){
      var el=document.getElementById('team-sessions');
      if(!el)return;
      if(snap.empty){el.innerHTML='<div class="empty" style="padding:1.5rem;"><p>No team sessions today</p></div>';return;}
      var rows='';
      snap.forEach(function(d){
        var data=d.data();
        var inT=data.clockIn?data.clockIn.toDate().toLocaleTimeString('en-CA',{hour12:false,hour:'2-digit',minute:'2-digit'}):'–';
        var outT=data.clockOut?data.clockOut.toDate().toLocaleTimeString('en-CA',{hour12:false,hour:'2-digit',minute:'2-digit'}):'🟢 Still in';
        var ms=data.clockOut&&data.clockIn?data.clockOut.toDate()-data.clockIn.toDate():0;
        var dur=ms?(Math.floor(ms/3600000)+'h '+Math.floor((ms%3600000)/60000)+'m'):'–';
        rows+='<tr><td><strong>'+esc(data.userName)+'</strong></td><td>'+inT+'</td><td>'+outT+'</td><td>'+dur+'</td></tr>';
      });
      el.innerHTML='<div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Clock In</th><th>Clock Out</th><th>Duration</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    }).catch(function(){});
  }
}

function loadClockReport(){
  var date=document.getElementById('clock-date-picker').value;
  var el=document.getElementById('clock-report-body');
  if(el)el.innerHTML='<div class="spin" style="margin:0 auto;"></div>';
  db.collection('clock').where('date','==',date).get().then(function(snap){
    if(!el)return;
    if(snap.empty){el.innerHTML='<p style="color:var(--gray-400);font-size:13px;padding:12px 0;">No entries for this date.</p>';return;}
    var entries=[];
    snap.forEach(function(d){entries.push(d.data());});
    entries.sort(function(a,b){return (a.clockIn?a.clockIn.toDate().getTime():0)-(b.clockIn?b.clockIn.toDate().getTime():0);});
    var totalMs=0;
    var rows=entries.map(function(data){
      var inT=data.clockIn?data.clockIn.toDate().toLocaleTimeString('en-CA',{hour12:false,hour:'2-digit',minute:'2-digit'}):'–';
      var outT=data.clockOut?data.clockOut.toDate().toLocaleTimeString('en-CA',{hour12:false,hour:'2-digit',minute:'2-digit'}):'🟢 Still in';
      var ms=data.clockOut&&data.clockIn?data.clockOut.toDate()-data.clockIn.toDate():0;
      totalMs+=ms;
      var h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000),s=Math.floor((ms%60000)/1000);
      var dur=ms>=3600000?h+'h '+m+'m':ms>=60000?m+'m '+s+'s':ms>0?s+'s':'–';
      var noteBtn=data.endOfDayTasks?'<button onclick="viewEodNote(\''+esc(data.userName)+'\',\''+esc(data.endOfDayTasks)+'\',\''+esc(data.endOfDayFeeling||'')+'\')" style="font-size:11px;padding:3px 8px;background:var(--brand-light);color:var(--brand);border:none;border-radius:6px;cursor:pointer;">📝</button>':'';
      return '<tr><td><strong>'+esc(data.userName||'—')+'</strong></td><td>'+inT+'</td><td>'+outT+'</td><td><strong>'+dur+'</strong></td><td>'+noteBtn+'</td></tr>';
    }).join('');
    var th=Math.floor(totalMs/3600000),tm=Math.floor((totalMs%3600000)/60000);
    el.innerHTML='<div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Clock In</th><th>Clock Out</th><th>Duration</th><th>Note</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
      +(totalMs>0?'<div style="text-align:right;font-size:12px;font-weight:700;color:var(--brand);padding:8px 4px;">Team total: '+th+'h '+tm+'m</div>':'');
  }).catch(function(e){if(el)el.innerHTML='<p style="color:red;font-size:12px;">'+e.message+'</p>';});
}

function generateMonthlyPDF(){
  var emp=document.getElementById('mr-emp').value;
  var monthInput=document.getElementById('mr-month').value;
  var pdfLang=document.getElementById('mr-lang').value;
  var includeNotes=document.getElementById('mr-notes').checked;
  if(!monthInput){showToast('Pick a month');return;}
  var btn=document.getElementById('mr-btn');
  btn.disabled=true;btn.textContent='Loading...';

  var year=parseInt(monthInput.split('-')[0]);
  var monthNum=parseInt(monthInput.split('-')[1]);
  var firstDay=monthInput+'-01';
  var daysInMonth=new Date(year,monthNum,0).getDate();
  var lastDay=monthInput+'-'+String(daysInMonth).padStart(2,'0');

  var FR=pdfLang==='fr';
  var L={
    title: FR?'BranChef — Rapport de présence':'BranChef — Attendance Report',
    days: FR?['Dim','Lun','Mar','Mer','Jeu','Ven','Sam']:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],
    headers: FR?['Jour','Entrée','Sortie','Durée','Statut']:['Day','Clock In','Clock Out','Duration','Status'],
    absent: FR?'Absent':'Absent',
    complete: FR?'Complet':'Complete',
    noClockOut: FR?'Pas de sortie':'No clock-out',
    summary: function(w,a,m,h,mi){
      return FR
        ?'Jours travaillés: '+w+'   |   Jours absents: '+a+'   |   Sorties manquées: '+m+'   |   Total: '+h+'h '+mi+'m'
        :'Days worked: '+w+'   |   Days absent: '+a+'   |   Missed clock-outs: '+m+'   |   Total: '+h+'h '+mi+'m';
    }
  };

  db.collection('clock').where('date','>=',firstDay).where('date','<=',lastDay).get().then(function(snap){
    var allEntries=[];
    snap.forEach(function(d){allEntries.push(d.data());});

    var names=emp==='__all__'?Object.values(TEAM).map(function(t){return t.name;}):[emp];
    var doc=new window.jspdf.jsPDF({unit:'pt',format:'a4'});
    var monthName=new Date(year,monthNum-1,1).toLocaleDateString(FR?'fr-CA':'en-US',{month:'long',year:'numeric'});

    names.forEach(function(empName,idx){
      if(idx>0)doc.addPage();

      doc.setFontSize(18);doc.setTextColor(124,58,237);
      doc.text(L.title,40,46);
      doc.setFontSize(13);doc.setTextColor(40,40,40);
      doc.text(empName,40,68);
      doc.setFontSize(10);doc.setTextColor(120,120,120);
      doc.text(monthName,40,84);

      var empEntries=allEntries.filter(function(e){return e.userName===empName;});
      var totalMs=0,worked=0,missed=0,absent=0;
      var body=[],notes=[];

      for(var day=1;day<=daysInMonth;day++){
        var dateStr=monthInput+'-'+String(day).padStart(2,'0');
        var dObj=new Date(year,monthNum-1,day);
        var dayLabel=L.days[dObj.getDay()]+' '+day;
        var dayEntries=empEntries.filter(function(e){return e.date===dateStr;});

        if(!dayEntries.length){
          body.push([dayLabel,'—','—','—',L.absent]);
          absent++;continue;
        }
        worked++;
        var dayMs=0,inTimes=[],outTimes=[],missedOut=false,tasks=[],feelings=[];
        dayEntries.forEach(function(e){
          if(e.clockIn)inTimes.push(e.clockIn.toDate());
          if(e.clockOut){outTimes.push(e.clockOut.toDate());}
          else if(e.clockIn){missedOut=true;}
          if(e.clockIn&&e.clockOut)dayMs+=e.clockOut.toDate()-e.clockIn.toDate();
          if(e.endOfDayTasks)tasks.push(e.endOfDayTasks);
          if(e.endOfDayFeeling)feelings.push(e.endOfDayFeeling);
        });
        totalMs+=dayMs;if(missedOut)missed++;
        var fmt=function(t){return t.toLocaleTimeString('en-CA',{hour12:false,hour:'2-digit',minute:'2-digit'});};
        var inS=inTimes.length?inTimes.map(fmt).join(', '):'—';
        var outS=outTimes.length?outTimes.map(fmt).join(', '):(missedOut?'⚠ —':'—');
        var h=Math.floor(dayMs/3600000),m=Math.floor((dayMs%3600000)/60000);
        var dur=dayMs>0?(h>0?h+'h '+m+'m':m+'m'):'—';
        var status=missedOut?L.noClockOut:L.complete;
        body.push([dayLabel,inS,outS,dur,status]);
        if(includeNotes&&(tasks.length||feelings.length))
          notes.push([dayLabel,tasks.join(' / ')||'—',feelings.join(' / ')||'—']);
      }

      var th=Math.floor(totalMs/3600000),tm=Math.floor((totalMs%3600000)/60000);
      doc.setFontSize(8.5);doc.setTextColor(90,90,90);
      doc.text(L.summary(worked,absent,missed,th,tm),40,100);

      doc.autoTable({
        startY:114,head:[L.headers],body:body,
        styles:{fontSize:8,cellPadding:4},
        headStyles:{fillColor:[124,58,237],textColor:255,fontStyle:'bold'},
        alternateRowStyles:{fillColor:[248,247,255]},
        columnStyles:{0:{cellWidth:70},4:{cellWidth:90}},
        didParseCell:function(d){
          if(d.section==='body'){
            if(d.row.raw[4]===L.absent)d.cell.styles.textColor=[180,30,30];
            else if(d.row.raw[4]===L.noClockOut)d.cell.styles.textColor=[200,120,0];
            else if(d.row.raw[4]===L.complete)d.cell.styles.textColor=[20,140,80];
          }
        }
      });

      if(includeNotes&&notes.length){
        var y=doc.lastAutoTable.finalY+20;
        if(y>700){doc.addPage();y=46;}
        doc.setFontSize(11);doc.setTextColor(124,58,237);
        doc.text(FR?'Notes de fin de journée':'End-of-day notes',40,y);
        doc.autoTable({
          startY:y+10,
          head:[[FR?'Jour':'Day',FR?'Tâches':'Tasks',FR?'Journée':'Day']],
          body:notes,
          styles:{fontSize:7.5,cellPadding:4},
          headStyles:{fillColor:[40,40,60],textColor:255},
          columnStyles:{0:{cellWidth:60},1:{cellWidth:220},2:{cellWidth:180}}
        });
      }
    });

    var fname='BranChef_Attendance_'+(emp==='__all__'?'AllStaff':emp)+'_'+monthInput+'.pdf';
    doc.save(fname);
    showToast('PDF downloaded!');
    btn.disabled=false;btn.textContent='📄 Download PDF';
    document.getElementById('mr-status').textContent='Downloaded: '+fname;
  }).catch(function(e){
    showToast('Error: '+e.message);
    btn.disabled=false;btn.textContent='📄 Download PDF';
  });
}

// VISUAL CAPTCHA
// ==========================================
var captchaCode='';
var captchaChars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

function genCaptcha(){
  captchaCode='';
  for(var i=0;i<5;i++) captchaCode+=captchaChars[Math.floor(Math.random()*captchaChars.length)];
  var ans=document.getElementById('captcha-ans');
  if(ans)ans.value='';
  drawCaptcha();
}

function drawCaptcha(){
  var canvas=document.getElementById('captcha-canvas');
  if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var w=canvas.width,h=canvas.height;

  // Background gradient
  var bg=ctx.createLinearGradient(0,0,w,h);
  bg.addColorStop(0,'#f0ebff');
  bg.addColorStop(1,'#e8f0ff');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,w,h);

  // Noise lines
  for(var i=0;i<6;i++){
    ctx.beginPath();
    ctx.moveTo(Math.random()*w,Math.random()*h);
    ctx.lineTo(Math.random()*w,Math.random()*h);
    ctx.strokeStyle='rgba('+(100+Math.floor(Math.random()*100))+','+(100+Math.floor(Math.random()*100))+','+(180+Math.floor(Math.random()*60))+',0.35)';
    ctx.lineWidth=1+Math.random();
    ctx.stroke();
  }

  // Noise dots
  for(var i=0;i<30;i++){
    ctx.beginPath();
    ctx.arc(Math.random()*w,Math.random()*h,Math.random()*2,0,Math.PI*2);
    ctx.fillStyle='rgba(100,80,200,0.2)';
    ctx.fill();
  }

  // Draw each character with random transforms
  var colors=['#6B21FF','#9B22CC','#3B44CC','#2277AA','#7B3FEF'];
  var fonts=['bold 26px Arial','bold 24px Georgia','bold 28px Verdana','bold 25px Courier New'];
  ctx.save();
  for(var i=0;i<captchaCode.length;i++){
    ctx.save();
    var x=16+i*28;
    var y=34+Math.random()*6-3;
    ctx.translate(x,y);
    ctx.rotate((Math.random()-0.5)*0.4);
    ctx.font=fonts[Math.floor(Math.random()*fonts.length)];
    ctx.fillStyle=colors[Math.floor(Math.random()*colors.length)];
    ctx.globalAlpha=0.85+Math.random()*0.15;
    // Shadow for depth
    ctx.shadowColor='rgba(100,50,200,0.3)';
    ctx.shadowBlur=2;
    ctx.fillText(captchaCode[i],0,0);
    ctx.restore();
  }
  ctx.restore();

  // Wavy overlay lines for distortion
  for(var i=0;i<2;i++){
    ctx.beginPath();
    ctx.moveTo(0,h/2+(i-0.5)*12);
    for(var x=0;x<w;x+=4){
      ctx.lineTo(x,h/2+(i-0.5)*12+Math.sin(x/8+i)*4);
    }
    ctx.strokeStyle='rgba(120,80,220,0.15)';
    ctx.lineWidth=1;
    ctx.stroke();
  }
}

window.addEventListener('load',function(){setTimeout(genCaptcha,500);});

function doLogin(){
  var email=document.getElementById('l-email').value.trim();
  var pass=document.getElementById('l-pass').value;

  var btn=document.getElementById('login-btn');

  if(ans!==captchaCode){
    err.textContent='❌ Wrong captcha code. Please try again.';
    err.style.display='block';
    genCaptcha();
    return;
  }
  if(!TEAM[email]){err.textContent='❌ This email is not in the BranChef team.';err.style.display='block';genCaptcha();return;}
  err.style.display='none';btn.disabled=true;btn.textContent='Signing in…';
  auth.signInWithEmailAndPassword(email,pass)
    .catch(function(e){
      var msg='❌ Wrong password. Try again.';

      err.textContent=msg;err.style.display='block';
      btn.disabled=false;btn.textContent='Sign in →';
      genCaptcha();
    });
}

var aiGreeted=false;

function toggleAIChat(){
  var panel=document.getElementById('ai-chat-panel');
  if(!panel)return;
  aiOpen=!aiOpen;
  panel.style.display=aiOpen?'flex':'none';
  if(aiOpen&&!aiGreeted){
    aiGreeted=true;
    addAIMsg('bot',t('ai_greeting'));
  }
  if(aiOpen){setTimeout(function(){var el=document.getElementById('ai-input');if(el)el.focus();},100);}
}

function addAIMsg(role,text){
  var el=document.getElementById('ai-messages');
  if(!el)return;
  var isBot=role==='bot';
  var div=document.createElement('div');
  div.style.cssText='display:flex;'+(isBot?'justify-content:flex-start;':'justify-content:flex-end;');
  var bubble=document.createElement('div');
  bubble.style.cssText='max-width:82%;padding:9px 13px;border-radius:'+(isBot?'4px 14px 14px 14px':'14px 4px 14px 14px')+';font-size:13px;line-height:1.5;'+(isBot?'background:var(--brand-light);color:var(--brand-text);':'background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;');
  bubble.textContent=text;
  div.appendChild(bubble);
  el.appendChild(div);
  el.scrollTop=el.scrollHeight;
}

function addAITyping(){
  var el=document.getElementById('ai-messages');
  if(!el)return;
  var div=document.createElement('div');
  div.id='ai-typing';
  div.style.cssText='display:flex;justify-content:flex-start;';
  div.innerHTML='<div style="background:var(--brand-light);padding:9px 14px;border-radius:4px 14px 14px 14px;font-size:18px;letter-spacing:2px;color:var(--brand);">•••</div>';
  el.appendChild(div);
  el.scrollTop=el.scrollHeight;
}

function removeTyping(){var t=document.getElementById('ai-typing');if(t)t.remove();}

var BRANCHEF_SYSTEM='You are the BranChef HQ AI assistant. BranChef is a virtual brand management company based in Montreal, Canada. It places multiple virtual brands inside physical restaurant locations and collects weekly commissions on delivery platform payouts (mainly Uber Eats, some DoorDash). The onboarding team consists of Saber (does most steps) and Zayd (UrbanPiper integration only). The 9-step onboarding process is: 1) Find empty Uber Eats store, 2) Fix address & pickup instructions, 3) Prepare Marco list & contact Ritik, 4) Ritik says DONE - send list to Marco, 5) Zayd does UrbanPiper integration, 6) Menu setup (language/prices/photos), 7) Update covers & mark Ready, 8) Owner review & approval, 9) Go Live & marketing. Sales team handles tablet requests. Owners (Nadir/Simo) can see everything and approve at step 8. You can also help write messages, emails, explain steps, translate things, or help with any work task. Answer questions about the platform, steps, team roles, or anything work-related. Be concise and friendly. If asked in French, answer in French.';

function sendAI(){
  var input=document.getElementById('ai-input');
  var btn=document.getElementById('ai-send-btn');
  if(!input)return;
  var msg=input.value.trim();
  if(!msg)return;
  input.value='';
  btn.disabled=true;
  addAIMsg('user',msg);
  addAITyping();
  setTimeout(function(){
    removeTyping();
    addAIMsg('bot',getBranChefAIReply(msg));
    btn.disabled=false;
  },600+Math.random()*500);
}

function getBranChefAIReply(msg){
  var m=msg.toLowerCase();
  var isFr=lang==='fr'||/bonjour|merci|comment|qu[ée]|pourquoi|quand|quel|aide|étape|étapes/.test(m);

  // Steps questions
  if(/step|étape|onboard|process|processus/.test(m)){
    if(isFr)return 'Le processus d\'intégration BranChef comporte 9 étapes:\n1. 🔍 Trouver le store Uber Eats vide\n2. 📍 Corriger l\'adresse & instructions de collecte\n3. 📋 Préparer la liste Marco + contacter Ritik\n4. ✅ Ritik dit DONE → envoyer liste à Marco\n5. 🔗 Intégration UrbanPiper (Zayd)\n6. 🍔 Configuration des menus\n7. 🎨 Mise à jour des covers + marquer Prêt\n8. 👑 Validation par Nadir/Simo\n9. 🚀 Go Live + Marketing';
    return 'The BranChef onboarding has 9 steps:\n1. 🔍 Find the empty Uber Eats store\n2. 📍 Fix address & pickup instructions\n3. 📋 Prepare Marco list & contact Ritik\n4. ✅ Ritik says DONE → send list to Marco\n5. 🔗 UrbanPiper integration (Zayd)\n6. 🍔 Menu setup (language/prices/photos)\n7. 🎨 Update covers & mark Ready\n8. 👑 Owner review (Nadir/Simo)\n9. 🚀 Go Live & Marketing';
  }
  // Saber role
  if(/saber/.test(m)){
    if(isFr)return 'Saber est responsable de presque toutes les étapes : trouver les stores, corriger les adresses, contacter Ritik et Marco, configurer les menus, mettre à jour les covers et gérer le Go Live. Il a accès à tout sauf UrbanPiper.';
    return 'Saber handles almost everything: finding stores, fixing addresses, contacting Ritik & Marco, menu setup, updating covers, and Go Live. He has access to everything except UrbanPiper.';
  }
  // Zayd role
  if(/zayd/.test(m)){
    if(isFr)return 'Zayd est spécialisé dans l\'intégration UrbanPiper (étape 5). C\'est lui qui connecte les stores Uber Eats à UrbanPiper après que Ritik confirme que c\'est prêt.';
    return 'Zayd specializes in UrbanPiper integration (step 5). He connects the Uber Eats stores to UrbanPiper after Ritik confirms they are ready.';
  }
  // Ritik / Marco
  if(/ritik/.test(m)){
    if(isFr)return 'Ritik est le contact UrbanPiper. Saber lui envoie la liste des stores à intégrer. Quand Ritik écrit DONE dans le groupe, Saber envoie la liste à Marco pour changer les noms.';
    return 'Ritik is the UrbanPiper contact. Saber sends him the list of stores to integrate. When Ritik writes DONE in the group, Saber sends the list to Marco for name changes.';
  }
  if(/marco/.test(m)){
    if(isFr)return 'Marco est le gestionnaire de compte Uber Eats. Saber lui envoie la liste des stores avec les nouveaux noms et numéros de téléphone. Marco gère aussi le Go Live des stores.';
    return 'Marco is the Uber Eats account manager. Saber sends him the list of stores with new names and phone numbers. Marco also handles the Go Live activation of stores.';
  }
  // Pipeline
  if(/pipeline|restaurant|status/.test(m)){
    if(isFr)return 'Le Pipeline montre tous les restaurants en cours d\'intégration. Chaque restaurant avance étape par étape. Saber et Zayd ne peuvent pas sauter d\'étape — chaque étape nécessite une note avant de passer à la suivante.';
    return 'The Pipeline shows all restaurants being onboarded. Each restaurant moves step by step. Saber and Zayd cannot skip steps — each step requires a written note before advancing.';
  }
  // Tablet
  if(/tablet|tablette/.test(m)){
    if(isFr)return 'Les demandes de tablette sont soumises par l\'équipe commerciale lorsqu\'un restaurant confirme son intérêt. Nadir et Simo reçoivent une alerte et peuvent marquer la tablette comme expédiée.';
    return 'Tablet requests are submitted by the sales team when a restaurant confirms interest. Nadir and Simo get an alert and can mark the tablet as shipped.';
  }
  // Clock / pointage
  if(/clock|pointage|heure|time/.test(m)){
    if(isFr)return 'Le pointage permet à chaque membre de l\'équipe d\'enregistrer ses heures. Cliquez sur "Pointage" dans le menu, puis sur "Clock In" pour commencer et "Clock Out" pour terminer. Nadir et Simo voient le rapport complet.';
    return 'Clock In/Out lets each team member track their hours. Click "Clock In/Out" in the menu, then click "Clock In" to start and "Clock Out" to finish. Nadir and Simo see the full report.';
  }
  // Brands / marques
  if(/brand|marque|virtual|virtuel/.test(m)){
    if(isFr)return 'BranChef place plusieurs marques virtuelles dans des restaurants physiques. Exemples de marques : Smash Burger, Poutine Mafia, KRNCHY CHICKEN, ShawarMan, etc. Les marques ont des noms différents du restaurant physique, d\'où l\'importance des instructions de collecte.';
    return 'BranChef places multiple virtual brands inside physical restaurants. Examples: Smash Burger, Poutine Mafia, KRNCHY CHICKEN, ShawarMan, etc. The brands have different names than the physical restaurant, which is why pickup instructions are important.';
  }
  // Menu
  if(/menu|language|langue|french|english|prix|price/.test(m)){
    if(isFr)return 'Pour la configuration du menu (étape 6) : si le restaurant est au Québec → menu en français québécois. Si c\'est le reste du Canada ou les USA → menu en anglais. Zéro tolérance pour les erreurs de menu. Les prix et photos doivent aussi être vérifiés.';
    return 'For menu setup (step 6): if the restaurant is in Quebec → Quebec French menu. If rest of Canada or USA → English menu. Zero tolerance for menu mistakes. Prices and photos must also be verified.';
  }
  // Go live / marketing
  if(/live|marketing|go live/.test(m)){
    if(isFr)return 'Le Go Live (étape 9) : Saber contacte le support Uber Eats par chat OU envoie un email à Marco pour activer les stores. Une fois en ligne, le marketing Uber Eats démarre 1 par 1.';
    return 'Go Live (step 9): Saber contacts Uber Eats support via chat OR sends an email to Marco to activate the stores. Once live, Uber Eats marketing starts 1 by 1.';
  }
  // Owner / Nadir / Simo
  if(/nadir|simo|owner|propriétaire/.test(m)){
    if(isFr)return 'Nadir et Simo sont les propriétaires de BranChef. Ils voient tout dans l\'application : pipeline complet, pointage de l\'équipe, demandes de tablette, et notifications. Ils approuvent les restaurants à l\'étape 8 avant le Go Live.';
    return 'Nadir and Simo are the BranChef owners. They see everything in the app: full pipeline, team clock log, tablet requests, and all notifications. They approve restaurants at step 8 before Go Live.';
  }
  // Write a message
  if(/write|message|email|draft|rédiger|écrire/.test(m)){
    if(isFr)return 'Bien sûr ! Dites-moi à qui vous voulez écrire et le sujet, je rédigerai le message pour vous. Exemple : "Écris un message à Marco pour lui demander de changer le nom du store X."';
    return 'Sure! Tell me who you want to write to and what about, and I\'ll draft it for you. Example: "Write a message to Marco asking him to change the name of store X."';
  }
  // Urbanpiper
  if(/urbanpiper|urban piper/.test(m)){
    if(isFr)return 'UrbanPiper est le logiciel tiers qui connecte les menus BranChef à Uber Eats. C\'est Zayd qui gère cette intégration (étape 5). Il reçoit la liste des stores de Saber et les connecte dans UrbanPiper.';
    return 'UrbanPiper is the third-party software that connects BranChef menus to Uber Eats. Zayd handles this integration (step 5). He receives the store list from Saber and connects them in UrbanPiper.';
  }
  // Hello / greeting
  if(/^(hi|hello|hey|bonjour|salut|yo|sup|hola)/.test(m)){
    if(isFr)return 'Bonjour ! 👋 Je suis l\'assistant IA de BranChef. Posez-moi des questions sur les étapes d\'intégration, les rôles de l\'équipe, ou demandez-moi de rédiger un message !';
    return 'Hey! 👋 I\'m the BranChef AI assistant. Ask me about onboarding steps, team roles, how the app works, or I can help you write a message!';
  }
  // Help
  if(/help|aide|comment|how/.test(m)){
    if(isFr)return 'Je peux vous aider avec :\n• Les 9 étapes d\'intégration\n• Les rôles de Saber, Zayd, Ritik, Marco\n• Comment fonctionne le Pipeline\n• Les demandes de tablette\n• Le pointage\n• Rédiger des messages ou emails\n• Tout ce qui concerne BranChef !';
    return 'I can help you with:\n• The 9 onboarding steps\n• Roles of Saber, Zayd, Ritik, Marco\n• How the Pipeline works\n• Tablet requests\n• Clock In/Out\n• Writing messages or emails\n• Anything BranChef related!';
  }
  // Default
  if(isFr)return 'Bonne question ! Je suis spécialisé dans BranChef — les étapes d\'intégration, les rôles de l\'équipe, le pipeline, les tablettes et le pointage. Pouvez-vous reformuler votre question en lien avec BranChef ?';
  return 'Good question! I specialize in BranChef topics — onboarding steps, team roles, the pipeline, tablets, and clock tracking. Could you rephrase your question related to BranChef?';
}

function roleLabel(r){return r==='owner'?'Owner 👑':r==='onboarding'?'Onboarding Team':'Sales Team';}
function v(id){var el=document.getElementById(id);return el?el.value.trim():'';}
function getSelChips(sel){var out=[];document.querySelectorAll(sel+'.sel').forEach(function(el){out.push(el.getAttribute('data-val'));});return out;}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function timeAgo(ts){if(!ts)return'';var d=ts.toDate?ts.toDate():new Date(ts);var diff=Math.floor((Date.now()-d.getTime())/1000);if(diff<60)return'just now';if(diff<3600)return Math.floor(diff/60)+'m ago';if(diff<86400)return Math.floor(diff/3600)+'h ago';return Math.floor(diff/86400)+'d ago';}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},3000);}
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
</script>

<script>
// Auto-reload when a new version is deployed
(function(){
  var CURRENT = '2026071301';
  function checkVersion(){
    fetch(window.location.href + '?v=' + Date.now(), {cache:'no-store'})
      .then(function(r){return r.text();})
      .then(function(html){
        var m = html.match(/<meta name="bc-version" content="([^"]+)"/);
        if(m && m[1] && m[1] !== CURRENT){
          console.log('New version detected, reloading...');
          window.location.reload(true);
        }
      }).catch(function(){});
  }
  // Check every 60 seconds
  setInterval(checkVersion, 60000);
  // Also check when tab becomes visible again
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') checkVersion();
  });
})();
</script>
